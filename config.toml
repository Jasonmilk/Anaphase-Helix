# ==============================================
# Anaphase-Helix Core Configuration
# Apache-2.0 | Cognitive Engine v0.1.0
# ==============================================

[anaphase]
# Service endpoints for external components
# Empty value = Auto-use Noop adapter (offline mode)
mind_endpoint = ""
flowmodus_endpoint = ""
tentacle_endpoint = ""
tuck_endpoint = ""
callosum_endpoint = ""
cellrix_endpoint = ""
cap_http_enabled = true
cap_http_port = 50061

# New: OpenAI-compatible LLM reasoning config
reasoning_endpoint = ""
reasoning_model = ""
reasoning_api_key = ""
reasoning_max_tokens = 2048

# run_cycle state-machine constants (candidate E, ADR-0005; DNA principle 11).
# These five values were historically hardcoded in agent_loop.rs — they now
# have a single config source. Missing section = documented protocol defaults.
[anaphase.run_cycle]
amygdala_default_vector = [0.7, 0.3, 0.2]   # PreAssessment amygdala vector
reasoning_mode = "left_brain"                 # mode label passed to ReasoningAdapter
soft_reflex_threshold = 0.7                   # p_death above this -> ReflexBlocked
execution_placeholder = "echo"                # legacy Execution command fallback
cycle_cap = 7                                 # run_cycle loop cap (infinite-cycle guard)

[cognitive]
# AI Model configuration for cognitive modules
amygdala_model = "qwen2.5:2b"
left_brain_model = "qwen2.5-coder:7b"
right_brain_model = "deepseek-r1:8b"
cerebellum_model = "qwen2.5:2b"
embedding_model = "BAAI/bge-small-en"

[immune]
# Immune system & reflex safety settings
hard_reflex_enabled = true
# Risk threshold for soft reflex (intercept = block, warn = alert)
soft_reflex_threshold_intercept = 0.7
soft_reflex_threshold_warn = 0.3
# Inherit safety rules from legacy crystals (default: disabled)
inherit_safety_rules = false
