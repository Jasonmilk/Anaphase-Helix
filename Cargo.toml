[package]
name = "anaphase"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core Async Runtime
tokio = { version = "1", features = ["full"] }

# gRPC (for Helix-Mind / FlowModus / Tuck adapters)
tonic = "0.11"
prost = "0.12"

# Async Traits & Serialization
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
petgraph = "0.6"

[build-dependencies]
# Protobuf Code Generation
tonic-build = "0.11"
