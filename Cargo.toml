[package]
name = "anaphase"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core Async Runtime
tokio = { version = "1", features = ["full"] }

# FlowModus
reqwest = { version = "0.12", features = ["json"] }

# gRPC (for Helix-Mind / FlowModus / Tuck adapters)
tonic = "0.10"           # <-- aligned with helix-mind-api (0.10)
prost = "0.12"
prost-types = "0.12"     # <-- MISSING: required by proto Timestamp

# Async Traits & Serialization
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
petgraph = "0.6"

# System probes (P10a T2: body vital-sign sensing → EnergyContext.system_load)
sysinfo = "0.30"

# HTTP CAP (cellrix)
axum = "0.7"

[dev-dependencies]
# Mock Mind gRPC server for integration tests (TcpListenerStream)
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
# Protobuf Code Generation
tonic-build = "0.10"     # <-- aligned with helix-mind-api (0.10)
