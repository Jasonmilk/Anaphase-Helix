<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>马卡龙卡片生成器 - 渲染修复版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-cream: #efefef;
            --card-base: #fcfaf8; 
            --macaron-pink: #ffb7b2;
            --macaron-green: #c1e1c1;
            --macaron-blue: #aec6cf;
            --macaron-purple: #e0bbe4;
            --macaron-amber: #ffbf00; 
            --text-dark: #4a3f3f; 
            --text-muted: #7c6e6e;
        }
        body { background: var(--bg-cream); color: var(--text-dark); font-family: 'Quicksand', 'Noto Sans SC', sans-serif; -webkit-font-smoothing: antialiased; }
        img, svg { display: inline-block !important; }
        .card-container { width: 375px; height: 500px; position: relative; overflow: hidden; background: var(--card-base); border-radius: 0px; box-shadow: none; display: flex; flex-direction: column; padding: 24px; line-height: 1.4; }
        .card-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
        .bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; border-radius: 0px; }
        .glass-panel { background: #ffffff; border: 2px solid #f0f0f0; border-radius: 20px; box-shadow: 0 4px 0px rgba(0,0,0,0.02); line-height: 1.5; }
        .tag { padding: 4px 12px; border-radius: 99px; font-size: 11px; font-weight: 700; background: #ffffff; color: var(--text-dark); border: 1.5px solid #eee; display: inline-block; line-height: 1; }
        .card-container h1, .card-container p, .card-container span { display: block; margin: 0; padding: 0; }
        .bubble-item { transform: translateY(0px); line-height: 1.2; }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-0 md:py-8">

    <div class="fixed top-0 w-full bg-white z-50 p-4 px-4 md:px-8 flex justify-between items-center shadow-md border-b-2 border-pink-100">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-[#ffb7b2] flex items-center justify-center text-white shadow-md">
                <i data-lucide="heart" class="w-5 h-5 fill-current"></i>
            </div>
            <h1 class="text-lg font-bold text-gray-800 tracking-tight">MACARON_STUDIO</h1>
        </div>
        <button onclick="window.dl()" class="bg-[#ffb7b2] text-white px-6 py-2.5 rounded-full font-bold shadow-md active:scale-95 transition-all flex items-center gap-2 text-sm">
            <i data-lucide="sparkles" class="w-4 h-4"></i> 打包下载
        </button>
    </div>

    <div id="cards" class="mt-20 px-0 md:px-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
    <div class="h-20"></div>

    <script>
        (function() {
            const C = { pk: '#ffb7b2', gn: '#c1e1c1', bl: '#aec6cf', pp: '#e0bbe4', am: '#ffbf00' };
            const data = [
                { t:'cover', h1:"周末<br>宅家指南", sub:"WEEKEND VLOG", auth:"@NANA_DAILY", tags:["#OOTD","#BRUNCH"], c:C.pk },
                { t:'list', h1:"晨间习惯", sub:"MORNING ROUTINE", ic:"sun", summary:"早起瑜伽30分钟，热燕麦拿铁开启元气满满的一天", items:[{l:"早起瑜伽",v:"30min",d:"唤醒身体能量"},{l:"热燕麦拿铁",v:"1 cup",d:"少糖去冰超好喝"}], c:C.am },
                { t:'bubbles', h1:"心情成分", sub:"MOOD BOARD", ic:"smile", summary:"今日心情配比：开心60%，发呆25%，追剧15%", d:[{l:"开心",v:60,c:C.pk},{l:"发呆",v:25,c:C.pp},{l:"追剧",v:15,c:C.bl}], c:C.pk },
                { t:'bar', h1:"穿搭色系", sub:"OOTD PALETTE", ic:"shirt", summary:"这个春天偏爱温柔的奶油色系", d:[{l:"Cream",v:50,h:1},{l:"Mint",v:30},{l:"Pink",v:20}], c:C.gn },
                { t:'big', h1:"今日摄入", sub:"WATER INTAKE", ic:"droplets", summary:"完成2.5L喝水目标，皮肤状态水润", m:"2.5L", md:"完成喝水目标", ss:[{l:"皮肤状态",v:"水润"}], c:C.bl },
                { t:'vs', h1:"甜点选择", sub:"SWEET CHOICE", ic:"cake", summary:"成年人当然是全都要！", l:{t:"马卡龙",v:"Pink",c:C.pk}, r:{t:"舒芙蕾",v:"Soft",c:C.bl}, c:C.pp },
                { t:'list', h1:"好物清单", sub:"WISHLIST", ic:"shopping-bag", summary:"海盐香薰蜡烛和Canon胶片相机，治愈系居家好物", items:[{l:"香薰蜡烛",v:"海盐",d:"治愈系居家好物"},{l:"胶片相机",v:"Canon",d:"记录生活碎片"}], c:C.pk },
                { t:'stat', h1:"运动打卡", sub:"FITNESS LOG", ic:"activity", summary:"今日步数5,210步，散步也是一种运动", v:"5,210", vl:"STEPS TODAY", desc:"散步也是一种运动，记得多出去走走。", c:C.gn },
                { t:'end', h1:"晚安日记", sub:"GOOD NIGHT", txt:"生活细碎万物成诗，今晚的月色真美。做个好梦，明天见。", f:"2026.05.20", c:C.pp }
            ];

            function drawBg(id, seed, color) {
                const cvs = document.getElementById(id);
                if (!cvs) return;
                const ctx = cvs.getContext('2d');
                cvs.width = 750; cvs.height = 1000; ctx.scale(2,2);
                
                ctx.fillStyle = '#fcfaf8'; 
                ctx.fillRect(0,0,375,500);
                
                const blob = (x,y,r,c) => {
                    const g = ctx.createRadialGradient(x,y,0,x,y,r);
                    g.addColorStop(0, c + '77'); 
                    g.addColorStop(1, c + '00');
                    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,6.28); ctx.fill();
                }
                blob(300, 50, 200, color); 
                blob(50, 450, 180, seed%2?C.bl:C.am);
            }

            const tpl = {
                cover: d => `
                    <div class="h-full flex flex-col justify-center items-center text-center pt-8">
                        <h1 class="text-5xl font-bold text-gray-800 leading-tight tracking-tight">${d.h1}</h1>
                        <div class="mt-6 px-4 py-1.5 rounded-full bg-[${d.c}] text-white font-bold tracking-widest text-xs inline-block leading-none">${d.sub}</div>
                        <div class="mt-12 flex gap-2 justify-center">${d.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
                        <p class="mt-10 text-gray-400 text-xs font-bold tracking-widest uppercase border-t border-gray-100 pt-6 px-8">BY ${d.auth}</p>
                    </div>`,
                list: d => `
                    <div class="space-y-4 mt-2">
                        ${d.items.map(i => `
                            <div class="glass-panel p-5 flex flex-col gap-1">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-gray-700">${i.l}</span>
                                    <div class="flex items-center justify-center h-7 px-4 rounded-lg bg-[${d.c}] shadow-sm">
                                        <span class="text-xs font-bold text-white leading-none">${i.v}</span>
                                    </div>
                                </div>
                                ${i.d?`<div class="text-xs text-gray-500 pt-1 leading-relaxed">${i.d}</div>`:''}
                            </div>`).join('')}
                    </div>`,
                bubbles: d => {
                    setTimeout(() => {
                        const el = document.getElementById('p-'+d.h1);
                        if(el) {
                            const ctx = el.getContext('2d');
                            let a = -1.57; d.d.forEach(i => {
                                ctx.beginPath(); ctx.moveTo(60,60); ctx.arc(60,60,55,a,a+=i.v/100*6.28); ctx.fillStyle=i.c; ctx.fill();
                                ctx.beginPath(); ctx.arc(60,60,35,0,6.28); ctx.fillStyle='#fcfaf8'; ctx.fill();
                            });
                        }
                    }, 0);
                    return `
                    <div class="h-64 relative flex items-center justify-center">
                        <canvas id="p-${d.h1}" width="120" height="120" class="z-10"></canvas>
                        ${d.d.map((item, idx) => {
                            const pos = [
                                {t:'top-0', l:'left-4'},
                                {t:'bottom-2', l:'right-6'},
                                {t:'top-8', l:'right-2'}
                            ][idx] || {t:'center', l:'center'};
                            
                            return `
                            <div class="bubble-item absolute ${pos.t} ${pos.l} flex flex-col items-center justify-center rounded-full shadow-md border-2 border-white text-center z-20" 
                                 style="padding: 8px 16px; background: #333; border-radius: 99px; min-width: 80px;">
                                <div class="text-xs font-bold uppercase leading-none mb-1" style="color: ${item.c}">${item.l}</div>
                                <div class="text-sm font-bold text-white leading-none">${item.v}%</div>
                            </div>`;
                        }).join('')}
                    </div>
                    <div class="mt-2 flex flex-wrap justify-center gap-3">
                        ${d.d.map(i => `<div class="flex items-center gap-1.5 text-xs font-bold text-gray-600"><div class="w-1.5 h-1.5 rounded-full" style="background:${i.c}"></div>${i.l}</div>`).join('')}
                    </div>`;
                },
                bar: d => `
                    <div class="pt-4 flex items-end justify-center gap-4 h-48 border-b-2 border-dashed border-gray-200 pb-6">
                        ${d.d.map(i => `
                            <div class="flex flex-col items-center gap-2">
                                <div class="text-xs font-bold text-gray-500">${i.v}%</div>
                                <div class="w-12 rounded-t-xl" 
                                    style="height:${i.v*2}px; background:${i.h?d.c:'#ddd'};"></div>
                                <div class="text-xs font-bold text-gray-600 uppercase tracking-wider">${i.l}</div>
                            </div>`).join('')}
                    </div>`,
                big: d => `
                    <div class="h-full flex flex-col justify-center items-center">
                        <div class="w-48 h-48 rounded-full border-[10px] border-[${d.c}] flex flex-col items-center justify-center bg-white shadow-inner">
                            <div class="text-5xl font-bold text-gray-800 leading-none">${d.m}</div>
                            <div class="text-xs font-bold text-gray-400 mt-2 tracking-widest uppercase leading-none">${d.md}</div>
                        </div>
                        <div class="mt-8 flex gap-4 w-full justify-center">
                            ${d.ss.map(s => `<div class="glass-panel px-6 py-3 text-center border-2 border-[${d.c}]"><div class="text-xs text-gray-500 uppercase font-bold leading-none mb-1">${s.l}</div><div class="font-bold text-gray-800 leading-none">${s.v}</div></div>`).join('')}
                        </div>
                    </div>`,
                vs: d => `
                    <div class="flex flex-col gap-4 mt-4">
                        <div class="glass-panel p-6 flex justify-between items-center border-l-8 border-[${d.l.c}]">
                            <span class="font-bold text-gray-700">${d.l.t}</span>
                            <span class="text-xl font-bold leading-none" style="color:${d.l.c}">${d.l.v}</span>
                        </div>
                        <div class="relative z-20 mx-auto bg-gray-200 rounded-full w-10 h-10 flex items-center justify-center text-xs text-gray-500 font-bold border-2 border-white shadow-sm">VS</div>
                        <div class="glass-panel p-6 flex justify-between items-center border-r-8 border-[${d.r.c}]">
                            <span class="text-xl font-bold leading-none" style="color:${d.r.c}">${d.r.v}</span>
                            <span class="font-bold text-gray-700">${d.r.t}</span>
                        </div>
                    </div>`,
                stat: d => `
                    <div class="flex flex-col h-full py-4 gap-6 justify-center">
                        <div class="text-center space-y-2">
                            <div class="inline-block p-4 rounded-full bg-[${d.c}] mb-2 shadow-md leading-none"><i data-lucide="${d.ic}" class="w-8 h-8 text-white"></i></div>
                            <div class="text-6xl font-bold text-gray-800 tracking-tighter leading-tight">${d.v}</div>
                            <div class="text-xs font-bold text-gray-400 tracking-[0.3em] uppercase leading-none">${d.vl}</div>
                        </div>
                        ${d.desc ? `<div class="glass-panel p-5 text-center text-xs text-gray-600 font-bold border-2 border-[${d.c}] leading-relaxed">${d.desc}</div>` : ''}
                    </div>`,
                end: d => `
                    <div class="h-full flex flex-col pt-10 text-center relative">
                        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-20 h-2 bg-[${d.c}] rounded-full"></div>
                        <h2 class="text-3xl font-bold text-gray-800 mb-8 mt-4 leading-tight">${d.sub}</h2>
                        <p class="text-xl text-gray-600 leading-relaxed font-bold italic">"${d.txt}"</p>
                    </div>`
            };

            const wrapper = document.getElementById('cards');
            wrapper.innerHTML = '';
            
            data.forEach((d, i) => {
                const isCover = d.t === 'cover';
                const isEnd = d.t === 'end';
                const h = isCover || isEnd ? '' : `<div class="flex items-center gap-2 mb-6 pb-3"><i data-lucide="${d.ic}" class="w-4 h-4 text-[${d.c}]"></i><span class="text-xs font-bold text-gray-500 tracking-widest uppercase flex-1 leading-none">${d.sub}</span></div>`;
                
                // 页脚生成逻辑
                const pageNum = `P${String(i + 1).padStart(2, '0')}`;
                const reportTitle = data[0].h1.replace(/<br>/g, ' ');
                
                let footerHtml = '';
                if (isCover || isEnd) {
                    // 封面和尾页：只显示标题和页码
                    footerHtml = `<div class="flex justify-between items-end mt-2">
                        <div class="flex gap-1 items-center leading-none">
                            <div class="w-2.5 h-2.5 rounded-full" style="background:${d.c}"></div>
                            <span class="text-xs text-gray-500 font-bold uppercase">DAILY_LOG</span>
                        </div>
                        <span class="text-xs text-gray-400 font-bold leading-none">${pageNum}</span>
                    </div>`;
                } else {
                    // 中间卡片：显示总结 + 标题 + 页码
                    const summaryText = d.summary || '';
                    footerHtml = `<div class="mt-2 space-y-2">
                        ${summaryText ? `<p class="text-xs text-gray-600 leading-relaxed font-bold text-center">${summaryText}</p>` : ''}
                        <div class="flex justify-between items-end">
                            <div class="flex gap-1 items-center leading-none">
                                <div class="w-2.5 h-2.5 rounded-full" style="background:${d.c}"></div>
                                <span class="text-xs text-gray-500 font-bold uppercase">DAILY_LOG</span>
                            </div>
                            <span class="text-xs text-gray-400 font-bold leading-none">${pageNum}</span>
                        </div>
                    </div>`;
                }
                
                wrapper.innerHTML += `
                    <div class="card-container" id="c-${i}">
                        <canvas id="cvs-${i}" class="bg-canvas"></canvas>
                        <div class="card-content">${h}${tpl[d.t](d)}${footerHtml}</div>
                    </div>`;
                setTimeout(() => drawBg(`cvs-${i}`, i, d.c), 0);
            });
            
            if (window.lucide) window.lucide.createIcons();

            window.dl = async function() {
                try {
                    const zip = new JSZip();
                    if (document.fonts && document.fonts.ready) await document.fonts.ready;
                    await new Promise(r => setTimeout(r, 500));
                    
                    for(let i=0; i<data.length; i++) {
                        const el = document.getElementById(`c-${i}`);
                        if(!el) continue;
                        
                        const canvas = await html2canvas(el, {
                            scale: 2, backgroundColor: '#fcfaf8', logging: false,
                            useCORS: true, allowTaint: true, y: 0, scrollX: 0, scrollY: 0
                        });
                        
                        const b = await new Promise(r => canvas.toBlob(r, 'image/png'));
                        zip.file(`MacaronCard_${i+1}.png`, b);
                    }
                    const content = await zip.generateAsync({type:"blob"});
                    saveAs(content, "MacaronPack.zip");
                } catch (e) {
                    console.error("Download failed:", e);
                }
            };
        })();
    </script>
</body>
</html>
