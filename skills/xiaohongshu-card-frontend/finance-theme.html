<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIP 金融科技卡片生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { font-family: 'Noto Sans SC', sans-serif; }
        body { background: #0a0a0a; -webkit-font-smoothing: antialiased; }
        img, svg { display: inline-block !important; }
        .card-container { width: 360px; height: 480px; background: #0d0d0d; position: relative; overflow: hidden; padding: 1.2rem; display: flex; flex-direction: column; border: none !important; box-shadow: none !important; border-radius: 0 !important; outline: none !important; }
        .card-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 0.5rem; }
        .bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 1; }
        .preview-wrapper:hover { transform: none; box-shadow: none; }
        .tag { display: inline-block; padding: 0.2rem 0.6rem; background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(255,215,0,0.1)); border: 1px solid rgba(212,175,55,0.4); font-size: 0.75rem; font-weight: 500; color: #d4af37; margin: 0 0.25rem 0.25rem 0; border-radius: 0.5rem; letter-spacing: 0.02em; backdrop-filter: blur(4px); }
        .dark-solid-bg { background-color: rgba(0, 0, 0,0.6); border: 0 solid transparent; box-shadow: none; }
    </style>
</head>
<body class="p-0 md:p-8 flex flex-col items-center min-h-screen">
    <div class="fixed top-0 left-0 w-full bg-black/95 backdrop-blur-md z-50 p-4 flex justify-between items-center px-4 md:px-8 border-b border-amber-900/30">
            <h2 class="text-lg font-bold text-amber-400">金融科技卡片生成器</h1>
        <button id="downloadBtn" class="bg-gradient-to-r from-amber-600 to-yellow-500 hover:from-amber-500 hover:to-yellow-400 text-black px-5 py-2 rounded-lg text-sm font-bold transition-all flex items-center gap-2 shadow-lg shadow-amber-500/20">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span id="btnText">生成并下载 ZIP</span>
        </button>
    </div>
    <div id="cards-wrapper" class="mt-24 px-0 md:px-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-7xl mx-auto"></div>
    <div class="h-20"></div>

    <script>
        // ==================== 黑金主题配色方案 ====================
        const colors = ['#d4af37','#f4d03f','#c9a227','#b8860b','#ffd700','#daa520'];

        // ==================== 卡片数据定义 ====================
        const cards = [
            { type: 'cover', title: "2025<br>财富管理新纪元", subtitle: "VIP 尊享 · 全球金融科技深度洞察报告", author: "发布方: 瑞银财富研究院", tags: ["#FinTech", "#数字资产", "#智能投顾"], bgSeed: 1 },
            { type: 'list', title: "市场格局", subtitle: "全球金融科技版图重塑", iconName: "globe", summary: "全球金融科技市场规模突破3400亿美元，亚太地区数字支付增长领跑", items: [
                { label: "市场规模", value: "$340B", desc: "2025年全球金融科技市场总估值突破3400亿美元" }, 
                { label: "增长引擎", value: "+27%", desc: "亚太地区数字支付年复合增长率领跑全球" }
            ], bgSeed: 2 },
            { type: 'chart-pie', title: "资产配置", subtitle: "高净值客户投资组合分布", iconName: "pie-chart", summary: "高净值客户投资组合呈现多元化趋势，数字资产占比达35%", data: [{ label: "数字资产", value: 35, color: "#d4af37" }, { label: "传统股票", value: 40, color: "#b8860b" }, { label: "另类投资", value: 25, color: "#ffd700" }], bgSeed: 3 },
            { type: 'chart-comp', title: "平台对决", subtitle: "头部智能投顾平台AUM对比", iconName: "bar-chart-2", summary: "智能投顾平台管理资产规模持续扩张，头部效应显著", data: [{ label: "Betterment", value: 38, highlight: true }, { label: "Wealthfront", value: 32 }, { label: "Schwab", value: 28 }], bgSeed: 4 },
            { type: 'highlight', title: "DeFi: 颠覆式增长", subtitle: "去中心化金融重塑价值链", iconName: "trending-up", summary: "DeFi协议锁仓量年增长189%，机构投资者参与率提升至67%", mainStat: "189%", mainStatDesc: "DeFi 协议锁仓量年增长率", subStats: [{ label: "机构投资者参与率提升", value: "67%" }], bgSeed: 5 },
            { type: 'vs', title: "合规与创新", subtitle: "监管科技的双刃剑效应", iconName: "shield", summary: "RegTech降低合规成本42%，但创新周期延长18%", left: { label: "合规成本下降", value: "42%", color: "text-amber-400" }, right: { label: "创新周期延长", value: "18%", color: "text-red-400" }, bgSeed: 6 },
            { type: 'list', title: "支付革命", subtitle: "数字支付重塑消费生态", iconName: "credit-card", summary: "BNPL在Z世代渗透率达34%，区块链将跨境支付压缩至秒级", items: [
                { label: "BNPL渗透率", value: "34%", desc: "先买后付服务在Z世代中普及率飙升" },
                { label: "跨境支付", value: "2.3s", desc: "区块链技术将结算时间从T+2压缩至秒级" }
            ], bgSeed: 7 },
            { type: 'stat-card', title: "AI 量化", subtitle: "机器学习驱动的投资革命", iconName: "cpu", summary: "78%的AI基金跑赢基准指数，量化投资革命加速", stat: "78%", statLabel: "AI基金跑赢基准指数", desc: "量化对冲基金采用深度学习模型后，超额收益能力显著提升，但尾部风险管理仍是关键课题。", bgSeed: 8 },
            { type: 'list-rank', title: "VIP 关注焦点", subtitle: "高净值客户核心诉求排名", iconName: "award", summary: "资产安全与隐私保护是高净值客户首要关注点，占比89%", items: [{ rank: 1, label: "资产安全与隐私保护", value: "89%" }, { rank: 2, label: "跨境投资便利性", value: "76%" }, { rank: 3, label: "ESG 可持续投资", value: "68%" }], bgSeed: 9 },
            { type: 'summary', title: "展望", subtitle: "驾驭变革，共创未来", text: "金融科技不再是边缘创新，而是财富管理的核心引擎。拥抱数字化转型、布局新兴资产、强化风控能力，将是高净值客户制胜下一个十年的关键。", footer: "瑞银财富研究院 · 2025 Q1", bgSeed: 10 }
        ];

        // 绘制背景图案（黑金极光效果）
        function drawPattern(id) {
            const canvas = document.getElementById(id);
            if (!canvas) return;
            const ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1, rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr; canvas.height = rect.height * dpr; ctx.scale(dpr, dpr);

            // 深黑基础背景
            ctx.fillStyle = '#0d0d0d'; ctx.fillRect(0, 0, rect.width, rect.height);

            // 金色极光效果 - 多层径向渐变
            const auroraColors = ['#d4af37','#f4d03f','#c9a227','#b8860b','#daa520'];

            // 第一层：大范围柔和金色光晕
            for (let i = 0; i < 2; i++) {
                const x = rect.width * (0.2 + Math.random() * 0.6), y = rect.height * (0.2 + Math.random() * 0.6);
                const r = rect.width * (0.8 + Math.random() * 0.4);
                const c = auroraColors[Math.floor(Math.random() * auroraColors.length)];
                const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, c + '15');
                g.addColorStop(0.3, c + '0A');
                g.addColorStop(0.7, c + '05');
                g.addColorStop(1, '#0d0d0d00');
                ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fill();
            }

            // 第二层：中等光斑
            for (let i = 0; i < 4; i++) {
                const x = Math.random() * rect.width * 1.2 - rect.width * 0.1, y = Math.random() * rect.height * 1.2 - rect.height * 0.1;
                const r = rect.width * (0.4 + Math.random() * 0.3);
                const c = colors[Math.floor(Math.random() * colors.length)];
                const g = ctx.createRadialGradient(x, y, r * 0.1, x, y, r);
                g.addColorStop(0, c + '20');
                g.addColorStop(0.5, c + '10');
                g.addColorStop(1, '#0d0d0d00');
                ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fill();
            }

            // 装饰性金色曲线
            ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 1; ctx.globalAlpha = 0.15; ctx.lineCap = 'round';
            for (let i = 0; i < 2; i++) {
                ctx.beginPath(); ctx.moveTo(Math.random() * rect.width, Math.random() < 0.5 ? 0 : rect.height);
                ctx.bezierCurveTo(Math.random() * rect.width * 1.5 - rect.width * 0.25, Math.random() * rect.height, Math.random() * rect.width * 1.5 - rect.width * 0.25, Math.random() * rect.height, Math.random() * rect.width, Math.random() < 0.5 ? 0 : rect.height);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            // 添加微妙的网格纹理
            ctx.strokeStyle = 'rgba(212,175,55,0.03)';
            ctx.lineWidth = 0.5;
            const gridSize = 30;
            for (let x = 0; x < rect.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, rect.height);
                ctx.stroke();
            }
            for (let y = 0; y < rect.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(rect.width, y);
                ctx.stroke();
            }
        }

        // 绘制饼图（金色主题）
        function drawPie(id, data) {
            const canvas = document.getElementById(id);
            if (!canvas) return;
            if (!canvas.width) canvas.width = 140;
            if (!canvas.height) canvas.height = 140;
            const ctx = canvas.getContext('2d'), cx = canvas.width / 2, cy = canvas.height / 2, r = Math.min(canvas.width, canvas.height) / 2 - 10, total = data.reduce((s, i) => s + i.value, 0);
            let angle = -Math.PI / 2;
            data.forEach(item => {
                const slice = (item.value / total) * 2 * Math.PI;
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, angle, angle + slice); ctx.closePath();
                ctx.fillStyle = item.color; ctx.fill(); ctx.strokeStyle = '#0d0d0d'; ctx.lineWidth = 3; ctx.stroke();
                angle += slice;
            });
        }

        // ==================== 卡片模板 (黑金主题) ====================
        const tpl = {
            cover: d => `<div class="flex items-center justify-start h-full"><div class="text-left"><h1 class="text-4xl leading-tight mb-4 font-black text-amber-400 drop-shadow-sm" style="text-shadow: 0 0 30px rgba(212,175,55,0.3);">${d.title}</h1><p class="text-sm font-medium text-amber-200/70 mb-3">${d.author}</p><div class="flex flex-wrap gap-2 mb-3">${d.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div><div class="text-xs font-medium text-amber-500/60 tracking-widest border-t border-amber-500/20 pt-3 mt-2">${d.subtitle}</div></div></div>`,
            summary: d => `<div class="flex-grow mt-4"><h2 class="text-2xl font-black text-amber-400 mb-4 pb-2 border-b border-amber-500/30" style="text-shadow: 0 0 20px rgba(212,175,55,0.2);">${d.title}</h2><p class="text-base text-amber-100/80 leading-relaxed font-normal">${d.text}</p><p class="text-xs text-amber-500/50 mt-4">${d.footer || ''}</p></div>`,
            list: d => `<ul class="space-y-4">${d.items.map(i => {
                const valueContent = i.value ? `<span class="text-base font-bold text-amber-400">${i.value}</span>` : '';
                const descContent = i.desc ? `<div class="text-sm text-amber-100/70 leading-snug mt-1">${i.desc}</div>` : '';
                return `<li class="p-4 dark-solid-bg rounded-lg border-l-4 border-l-amber-500">
                    <div class="flex justify-between items-center mb-1">
                        <div class="text-xs text-amber-500/80 font-medium uppercase tracking-widest">${i.label}</div>
                        ${valueContent}
                    </div>
                    ${descContent}
                </li>`;
            }).join('')}</ul>`,
            'chart-pie': d => `<div class="flex items-center justify-center" style="height: 70%;"><div class="grid grid-cols-3 gap-2 items-center w-full"><div class="flex flex-col items-start space-y-2">${d.data.slice(0, Math.ceil(d.data.length / 2)).map(i => `<div class="inline-flex items-center gap-1.5 px-2.5 py-1.5 dark-solid-bg rounded-full whitespace-nowrap text-xs"><span class="font-bold text-amber-400">${i.value}%</span><span class="font-normal text-amber-100/70">${i.label}</span></div>`).join('')}</div><div class="flex items-center justify-center"><canvas id="pie-${d.bgSeed}" width="140" height="140"></canvas></div><div class="flex flex-col items-end space-y-2">${d.data.slice(Math.ceil(d.data.length / 2)).map(i => `<div class="inline-flex items-center gap-1.5 px-2.5 py-1.5 dark-solid-bg rounded-full whitespace-nowrap text-xs"><span class="font-bold text-yellow-500">${i.value}%</span><span class="font-normal text-amber-100/70">${i.label}</span></div>`).join('')}</div></div></div>`,
            'chart-comp': d => `<div class="flex items-end justify-center gap-6 h-48 mb-6 px-1">${d.data.map(i => `<div class="flex flex-col items-center gap-2"><div class="text-sm font-bold ${i.highlight ? 'text-amber-400' : 'text-amber-600/60'}">${i.value}%</div><div class="w-16 ${i.highlight ? 'bg-gradient-to-t from-amber-600 to-yellow-500 shadow-lg shadow-amber-500/30' : 'bg-amber-900/50 border border-amber-700/30'} rounded-t-xl transition-all" style="height:${i.value * 3}px"></div><div class="text-xs font-normal text-amber-100/70 text-center w-20">${i.label}</div></div>`).join('')}</div>`,
            highlight: d => `<div class="dark-solid-bg p-4 border-l-4 border-l-amber-500 rounded-lg mb-4"><div class="text-5xl font-black text-amber-400 leading-none" style="text-shadow: 0 0 40px rgba(212,175,55,0.4);">${d.mainStat}</div><div class="text-xs font-medium text-amber-200/70 uppercase tracking-[0.2em] mt-2">${d.mainStatDesc}</div></div><div class="dark-solid-bg p-3 flex justify-between items-center rounded-lg"><span class="text-xs font-normal text-amber-200/60">${d.subStats[0].label}</span><span class="text-lg font-bold text-amber-400">${d.subStats[0].value}</span></div>`,
            vs: d => `<div class="space-y-3"><div class="dark-solid-bg p-4 flex justify-between items-center rounded-lg"><span class="text-sm font-medium text-amber-100/80 uppercase tracking-widest">${d.left.label}</span><span class="text-2xl font-bold ${d.left.color}">${d.left.value}</span></div><div class="relative z-20 flex items-center justify-center -my-2"><div class="bg-gradient-to-r from-amber-600 to-yellow-500 text-black font-black text-xs px-3 py-1 rounded-full shadow-lg">VS</div></div><div class="dark-solid-bg p-4 flex justify-between items-center rounded-lg"><span class="text-sm font-medium text-amber-100/80 uppercase tracking-widest">${d.right.label}</span><span class="text-2xl font-bold ${d.right.color}">${d.right.value}</span></div></div>`,
            'stat-card': d => `<div class="dark-solid-bg p-4 text-center mb-4 rounded-lg"><div class="text-5xl font-black text-amber-400" style="text-shadow: 0 0 40px rgba(212,175,55,0.4);">${d.stat}</div><div class="text-xs font-medium text-amber-500 uppercase tracking-[0.3em] mt-2">${d.statLabel}</div></div><p class="text-sm text-amber-100/70 text-left leading-relaxed font-normal px-2 py-2 dark-solid-bg rounded-lg">${d.desc}</p>`,
            'list-rank': d => `<ul class="space-y-4">${d.items.map(i => {
                const rankStyle = `text-base font-bold w-6 ${i.rank === 1 ? 'text-amber-400' : 'text-amber-600/60'}`;
                const labelStyle = "flex-1 text-sm font-normal text-amber-100/80 leading-tight";
                const valueStyle = "text-base font-bold text-amber-400";
                return `<li class="p-3 dark-solid-bg rounded-lg border-l-4 border-l-amber-600">
                    <div class="flex justify-between items-start gap-2">
                        <div class="${rankStyle}">${i.rank}</div>
                        <div class="${labelStyle}">${i.label}</div>
                        <div class="${valueStyle}">${i.value}</div>
                    </div>
                </li>`;
            }).join('')}</ul>`
        };

        // 渲染所有卡片到页面
        function render() {
            document.getElementById('cards-wrapper').innerHTML = cards.map((d, i) => {
                const isCover = d.type === 'cover';
                const isSummary = d.type === 'summary';

                let contentHtml;
                if (isCover || isSummary) {
                    contentHtml = tpl[d.type](d);
                } else {
                    const cardBody = tpl[d.type](d);
                    contentHtml = `<div class="flex-grow mt-4"><h2 class="text-lg font-black text-amber-400 pb-2 border-b border-amber-500/30 mb-4 uppercase tracking-tighter flex items-center gap-2"><i data-lucide="${d.iconName || 'file-text'}" class="w-4 h-4 text-amber-500"></i>${d.title}</h2>${cardBody}</div>`;
                }

                // 页脚生成逻辑
                const pageNum = `P${String(i + 1).padStart(2, '0')}`;
                const reportTitle = cards[0].title.replace(/<br>/g, ' ');
                
                let footerHtml = '';
                if (isCover || isSummary) {
                    // 封面和尾页：只显示标题和页码
                    footerHtml = `<div class="flex justify-between items-end mt-4">
                        <h3 class="text-xs tracking-[0.1em] uppercase text-amber-600/50 font-black truncate max-w-[60%]">${reportTitle}</h3>
                        <span class="text-xs font-mono text-amber-700/40">${pageNum}</span>
                    </div>`;
                } else {
                    // 中间卡片：显示总结 + 标题 + 页码
                    const summaryText = d.summary || '';
                    footerHtml = `<div class="mt-4 space-y-2">
                        ${summaryText ? `<p class="text-xs text-amber-200/60 leading-relaxed">${summaryText}</p>` : ''}
                        <div class="flex justify-between items-end">
                            <h3 class="text-xs tracking-[0.1em] uppercase text-amber-600/50 font-black truncate max-w-[60%]">${reportTitle}</h3>
                            <span class="text-xs font-mono text-amber-700/40">${pageNum}</span>
                        </div>
                    </div>`;
                }

                return `<div class="preview-wrapper"><div class="card-container" id="card-${i}"><canvas id="canvas-${i}" class="bg-canvas"></canvas><div class="card-content">${!isCover ? '<div class="mb-4"></div>' : ''}${contentHtml}${footerHtml}</div></div></div>`;
            }).join('');
        }

        // 一键下载所有卡片为ZIP
        async function downloadAll() {
            const btn = document.getElementById('downloadBtn'), txt = document.getElementById('btnText');
            btn.disabled = true; txt.innerText = "生成中...";
            try {
                const zip = new JSZip(), els = document.querySelectorAll('.card-container');
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

                for (let i = 0; i < els.length; i++) {
                    txt.innerText = `渲染 ${i + 1}/${els.length}`;
                    await new Promise(r => setTimeout(r, 100));
                    const canvas = await html2canvas(els[i], {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: '#0d0d0d',
                        logging: false,
                        onclone: doc => {
                            doc.querySelectorAll('img,svg').forEach(e => e.style.display = 'inline-block');

                            const style = doc.createElement('style');
                            style.textContent = `
                                .card-container .border-l-4 { border-left-width: 2px !important; }
                                .card-container .border-l-2 { border-left-width: 1px !important; }
                                .card-container [class*="border-"] { border-width: 0.5px !important; }
                                .card-container [class*="border-l-"] { border-left-width: 2px !important; }
                            `;
                            doc.head.appendChild(style);

                            doc.querySelectorAll('.card-container').forEach(c => {
                                c.style.borderRadius = '0';
                                c.style.boxShadow = 'none';
                                c.style.border = 'none';
                                c.style.outline = 'none';
                            });
                        }
                    });
                    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.95));
                    zip.file(`${String(i + 1).padStart(2, '0')}_VIP_FinTech_Card.jpg`, blob);
                }

                window.scrollTo(0, scrollTop);
                saveAs(await zip.generateAsync({ type: "blob" }), "VIP_FinTech_Cards.zip");
                txt.innerText = "完成";
                setTimeout(() => { btn.disabled = false; txt.innerText = "生成并下载 ZIP"; }, 2000);
            } catch (err) {
                console.error('下载失败:', err);
                btn.disabled = false;
                txt.innerText = "失败，重试";
            }
        }

        // 页面加载完成后初始化
        window.onload = () => {
            render();
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    cards.forEach((d, i) => {
                        drawPattern(`canvas-${i}`);
                        if (d.type === 'chart-pie') drawPie(`pie-${d.bgSeed}`, d.data);
                    });
                    if (typeof window.lucide !== 'undefined') {
                        window.lucide.createIcons();
                    }
                });
            });
            
            document.getElementById('downloadBtn').addEventListener('click', downloadAll);
        };
    </script>
</body>
