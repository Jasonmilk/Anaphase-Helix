<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI红包大战 - 红金奢华版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { font-family: 'Noto Sans SC', sans-serif; }
        .serif { font-family: 'Noto Serif SC', serif; }
        body { background: #3f0e0e; -webkit-font-smoothing: antialiased; }
        img, svg { display: inline-block !important; }
        .card-container { 
            width: 360px; 
            height: 480px; 
            background: linear-gradient(160deg, #7F1D1D 0%, #550e0e 50%, #2f0505 100%);
            position: relative; 
            overflow: hidden; 
            padding: 1.4rem; 
            display: flex; 
            flex-direction: column; 
            border: 1px solid #991b1b;
            border-radius: 0 !important; 
            box-shadow: none !important;
        }
        .card-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
        .bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.8; pointer-events: none; }
        .preview-wrapper { transition: none; }
        .text-gold { color: #FFD700; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .text-silver { color: #F3F4F6; }
        .tag { display: inline-block; padding: 0.2rem 0.6rem; background: rgba(255, 215, 0, 0.15); border: 1px solid rgba(255, 215, 0, 0.5); font-size: 0.7rem; font-weight: 500; color: #FFD700; margin: 0 0.25rem 0.25rem 0; border-radius: 2px; letter-spacing: 0.02em; backdrop-filter: blur(4px); }
        .simple-bg { background: rgba(20, 5, 5, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 215, 0, 0.25); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
        .gold-line { height: 1px; background: linear-gradient(90deg, transparent, #FFD700, transparent); margin: 0.5rem 0; opacity: 0.6; }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center min-h-screen">
    <div class="fixed top-0 left-0 w-full bg-[#3f0e0e] z-50 p-4 flex justify-between items-center px-8 border-b border-[#5e1616] shadow-xl">
        <div>
            <h1 class="text-lg font-bold text-[#FFD700]">AI红包大战生成器</h1>
            <p class="text-xs text-red-200">红金奢华版主题</p>
        </div>
        <button id="downloadBtn" onclick="downloadAll()" class="bg-gradient-to-r from-[#D4AF37] to-[#FFD700] hover:from-[#C5A028] hover:to-[#E6C200] text-[#2A0808] px-5 py-2 rounded-lg text-sm font-bold transition-all flex items-center gap-2 shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span id="btnText">生成并下载 ZIP</span>
        </button>
    </div>
    <div id="cards-wrapper" class="mt-24 px-2 md:px-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-7xl mx-auto"></div>
    <div class="h-20"></div>

    <script>
        const particles = ['#FFD700', '#FF6B6B', '#FFC0CB', '#FCD34D'];
        const chartColors = [{ color: '#FFD700', label: '金色' }, { color: '#FF453A', label: '红色' }, { color: '#E5E7EB', label: '银色' }, { color: '#8B0000', label: '暗红' }];
        const cards = [
            { type: 'cover', title: "15亿红包<br>AI开抢攻略", subtitle: "2026 乙巳蛇年 · 春节特别企划", author: "科技前沿观察", tags: ["#AI元年", "#搞钱攻略", "#科技春节"], bgSeed: 1 },
            { type: 'list', title: "战况总览", subtitle: "互联网新一轮\"军备竞赛\"", iconName: "flame", summary: "AI红包大战本质上是AI助手的全面普及战，用体验换留存。", items: [
                { label: "战场转移", value: "ALL IN AI", desc: "不再是单纯的支付大战，而是AI助手的全面普及战。" }, 
                { label: "核心玩法", value: "体验即红包", desc: "用AI写春联、做视频、算运势，完成任务领现金。" }
            ], bgSeed: 2 },
            { type: 'stat-card', title: "腾讯元宝", subtitle: "社交裂变王者", iconName: "crown", summary: "依托微信生态，10亿+现金红包打造社交裂变闭环。", stat: "10亿+", statLabel: "现金总奖池", desc: "玩法：微信生态无缝衔接。在群里发AI红包、用元宝生成拜年表情包，最高抽万元\"小马卡\"。", bgSeed: 3 },
            { type: 'stat-card', title: "百度文心", subtitle: "互动剧情玩法", iconName: "sparkles", summary: "5亿红包+北京台春晚，数字人陪伴式AI体验。", stat: "5亿", statLabel: "现金红包", desc: "玩法：结合北京台春晚。由文心一言驱动的\"数字人\"陪你过年，解锁剧情领红包。", bgSeed: 4 },
            { type: 'list', title: "字节豆包", subtitle: "春晚独家合作伙伴", iconName: "tv", summary: "央视春晚主场，火山引擎提供技术支持，AIGC创作引爆抖音。", items: [
                { label: "主场优势", value: "央视春晚", desc: "火山引擎提供全套AI技术支持。" }, 
                { label: "视频互动", value: "AIGC创作", desc: "用户上传照片，AI生成全家福视频，直接在抖音分发。" }
            ], bgSeed: 5 },
            { type: 'list', title: "阿里千问", subtitle: "生态深度融合", iconName: "layers", summary: "不单独作战，嵌入淘宝、高德等场景，实物+现金双管齐下。", items: [
                { label: "策略", value: "场景化", desc: "不单独作战，而是嵌入淘宝（购物）、高德（出行）等场景。" }, 
                { label: "福利", value: "实物+现金", desc: "除了现金，更多是电商优惠券和实物大奖。" }
            ], bgSeed: 6 },
            { type: 'chart-pie', title: "投入金额占比", subtitle: "谁最舍得砸钱？", iconName: "pie-chart", summary: "腾讯元宝10亿领跑，总投入超20亿，竞争白热化。", data: [{ label: "腾讯元宝", value: 10, color: "#FFD700" }, { label: "百度文心", value: 5, color: "#FF453A" }, { label: "字节豆包", value: 4, color: "#E5E7EB" }, { label: "阿里千问", value: 1, color: "#8B0000" }], bgSeed: 7 },
            { type: 'list', title: "底层逻辑", subtitle: "醉翁之意不在酒", iconName: "target", summary: "春节抢占AI使用习惯，海量真实中文语料比花钱买数据更值。", items: [
                { label: "抢入口", value: "流量", desc: "春节是唯一的全民空闲窗口，抢占AI使用习惯。" }, 
                { label: "练模型", value: "数据", desc: "海量真实的中文语料交互，比花钱买数据更值。" }
            ], bgSeed: 8 },
            { type: 'highlight', title: "终局预测", subtitle: "留存才是硬道理", iconName: "trophy", summary: "春节后的留存率才是核心指标，好用才是王道。", mainStat: "留存率", mainStatDesc: "春节后的核心指标", subStats: [{ label: "关键", value: "好用才是王道" }], bgSeed: 9 },
            { type: 'summary', title: "结语", subtitle: "AI时代的除夕夜", text: "2026年的春节，或许是我们第一次习惯有AI陪伴的春节。红包只是引子，智能生活才是未来。", footer: "祝大家蛇年大吉 · 财源滚滚", bgSeed: 10 }
        ];

        function drawPattern(id) {
            const canvas = document.getElementById(id);
            if (!canvas) return;
            const ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1, rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr; canvas.height = rect.height * dpr; ctx.scale(dpr, dpr);
            for (let i = 0; i < 30; i++) {
                const x = Math.random() * rect.width, y = Math.random() * rect.height, r = Math.random() * 3.5 + 0.5, color = particles[Math.floor(Math.random() * particles.length)];
                ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.globalAlpha = Math.random() * 0.4 + 0.2; ctx.fill();
            }
            ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 0.5; ctx.globalAlpha = 0.2;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(rect.width, rect.height); ctx.moveTo(rect.width, 0); ctx.lineTo(0, rect.height); ctx.stroke();
            const g = ctx.createLinearGradient(0, rect.height * 0.6, 0, rect.height);
            g.addColorStop(0, 'rgba(220, 38, 38, 0)'); g.addColorStop(1, 'rgba(220, 38, 38, 0.2)');
            ctx.fillStyle = g; ctx.fillRect(0, 0, rect.width, rect.height);
        }

        function drawPie(id, data) {
            const canvas = document.getElementById(id);
            if (!canvas) return;
            if (!canvas.width) canvas.width = 160;
            if (!canvas.height) canvas.height = 160;
            const ctx = canvas.getContext('2d'), cx = canvas.width / 2, cy = canvas.height / 2, r = Math.min(canvas.width, canvas.height) / 2 - 10, total = data.reduce((s, i) => s + i.value, 0);
            let angle = -Math.PI / 2;
            data.forEach(item => {
                const slice = (item.value / total) * 2 * Math.PI;
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, angle, angle + slice); ctx.closePath();
                ctx.fillStyle = item.color; ctx.fill(); 
                ctx.strokeStyle = '#550e0e'; ctx.lineWidth = 2; ctx.stroke();
                angle += slice;
            });
        }

        const tpl = {
            cover: d => `<div class="flex items-center justify-center h-full border-2 border-[#FFD700]/40 p-2 relative">
                    <div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-[#FFD700]"></div>
                    <div class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 border-[#FFD700]"></div>
                    <div class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 border-[#FFD700]"></div>
                    <div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-[#FFD700]"></div>
                    <div class="text-center w-full">
                        <div class="text-xs text-[#FFD700] tracking-[0.4em] mb-6 uppercase border-b border-[#FFD700]/30 pb-2 inline-block">${d.subtitle}</div>
                        <h1 class="serif text-5xl leading-tight mb-6 font-black text-white drop-shadow-md tracking-wide">
                            <span class="text-gold">15亿</span>红包<br><span class="text-gold">AI</span>开抢攻略
                        </h1>
                        <div class="flex justify-center flex-wrap gap-2 mb-8">${d.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
                        <p class="text-xs font-medium text-silver opacity-80 mt-8">出品：${d.author}</p>
                    </div>
                </div>`,
            summary: d => `<div class="flex-grow mt-4 flex flex-col justify-center">
                    <h2 class="serif text-3xl font-black text-gold mb-6 text-center">${d.title}</h2>
                    <div class="simple-bg p-6 rounded-none border border-[#FFD700]/30 relative">
                         <i data-lucide="quote" class="absolute -top-3 -left-2 w-6 h-6 text-[#FFD700] fill-[#FFD700] opacity-50"></i>
                        <p class="text-base text-silver leading-loose font-normal text-justify indent-8">${d.text}</p>
                    </div>
                    <div class="text-center mt-8">
                        <div class="gold-line w-1/2 mx-auto"></div>
                        <p class="text-xs text-[#FFD700] tracking-widest mt-2">${d.footer||''}</p>
                    </div>
                </div>`,
            list: d => `<ul class="space-y-4 mt-2">${d.items.map(i => `<li class="p-4 simple-bg border-l-2 border-l-[#FFD700]"><div class="flex justify-between items-center mb-1"><div class="text-xs text-gold font-bold uppercase tracking-widest">${i.label}</div>${i.value ? `<span class="text-sm font-black text-white bg-[#FF453A] px-2 py-0.5 rounded-sm shadow-sm">${i.value}</span>` : ''}</div>${i.desc ? `<div class="text-sm text-silver leading-snug mt-2 opacity-95">${i.desc}</div>` : ''}</li>`).join('')}</ul>`,
            'chart-pie': d => `<div class="flex flex-col items-center justify-center h-full">
                    <div class="relative mb-6">
                        <canvas id="pie-${d.bgSeed}" width="160" height="160"></canvas>
                        <div class="absolute inset-0 flex items-center justify-center pointer-events-none"><span class="text-xs text-white opacity-60">亿级</span></div>
                    </div>
                    <div class="grid grid-cols-2 gap-x-8 gap-y-3 w-full px-2">${d.data.map(i => `<div class="flex items-center justify-between border-b border-[#FFD700]/20 pb-1"><div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full shadow-sm" style="background:${i.color}"></span><span class="text-xs text-silver">${i.label}</span></div><span class="text-sm font-bold text-gold font-mono">${i.value}</span></div>`).join('')}</div>
                </div>`,
            highlight: d => `<div class="h-full flex flex-col justify-center">
                    <div class="simple-bg p-6 text-center border border-[#FFD700]/30 relative overflow-hidden mb-4 group">
                        <div class="absolute top-0 left-0 w-full h-1 bg-[#FFD700]"></div>
                        <div class="text-6xl font-black text-gold drop-shadow-sm serif my-4 tracking-tighter">${d.mainStat}</div>
                        <div class="text-xs font-medium text-silver uppercase tracking-[0.3em]">${d.mainStatDesc}</div>
                    </div>
                    <div class="flex justify-between items-center px-4 py-3 border border-[#FFD700]/20 bg-black/20">
                        <span class="text-xs text-silver opacity-80">${d.subStats[0].label}</span>
                        <span class="text-lg font-bold text-white">${d.subStats[0].value}</span>
                    </div>
                </div>`,
            'stat-card': d => `<div class="mt-2"><div class="simple-bg p-5 text-center mb-4 border border-[#FFD700]/30"><div class="text-5xl font-black text-gold drop-shadow-sm font-mono tracking-tighter">${d.stat}</div><div class="text-xs font-bold text-[#FF453A] uppercase tracking-[0.2em] mt-2 bg-[#FF453A]/10 inline-block px-2 py-1 rounded border border-[#FF453A]/20">${d.statLabel}</div></div><div class="text-sm text-silver text-justify leading-relaxed font-normal p-3 border-l-2 border-[#FFD700] pl-4 bg-black/10">${d.desc}</div></div>`
        };

        function render() {
            document.getElementById('cards-wrapper').innerHTML = cards.map((d, i) => {
                const isCover = d.type === 'cover', isSummary = d.type === 'summary';
                let contentHtml;
                if (isCover || isSummary) {
                    contentHtml = tpl[d.type](d);
                } else {
                    const cardBody = tpl[d.type](d);
                    contentHtml = `<div class="flex-grow mt-2"><h2 class="text-xl font-black text-white pb-2 mb-4 uppercase tracking-wider flex items-center gap-2 border-b border-[#FFD700]/30"><span class="bg-[#FFD700] text-black p-0.5 rounded-sm"><i data-lucide="${d.iconName||'file-text'}" class="w-4 h-4"></i></span><span class="text-gold">${d.title}</span></h2>${cardBody}</div>`;
                }
                return `<div class="preview-wrapper"><div class="card-container" id="card-${i}"><canvas id="canvas-${i}" class="bg-canvas"></canvas><div class="card-content">${!isCover ? '<div class="mb-2"></div>' : ''}${contentHtml}<div class="mt-auto pt-3">${!isCover && !isSummary && d.summary ? `<div class="text-xs text-silver leading-relaxed mb-2 opacity-90 border-b border-[#FFD700]/20 pb-2">${d.summary}</div>` : ''}<div class="flex justify-between items-end"><h3 class="text-xs tracking-[0.1em] uppercase text-[#FFD700] opacity-80 font-bold truncate max-w-[60%]">AI红包大战</h3><span class="text-xs font-mono text-silver opacity-60">${String(i+1).padStart(2,'0')} / ${String(cards.length).padStart(2,'0')}</span></div></div></div></div></div>`;
            }).join('');
        }

        async function downloadAll() {
            const btn = document.getElementById('downloadBtn'), txt = document.getElementById('btnText');
            btn.disabled = true; txt.innerText = "生成中...";
            try {
                const zip = new JSZip(), els = document.querySelectorAll('.card-container');
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                for (let i = 0; i < els.length; i++) {
                    txt.innerText = `处理 ${i+1}/${els.length}`;
                    await new Promise(r => setTimeout(r, 50));
                    const canvas = await html2canvas(els[i], { scale: 2, useCORS: true, backgroundColor: null, logging: false, onclone: doc => { doc.querySelectorAll('img,svg').forEach(e => e.style.display = 'inline-block'); } });
                    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.95));
                    zip.file(`${String(i+1).padStart(2,'0')}_Gold_Edition.jpg`, blob);
                }
                window.scrollTo(0, scrollTop);
                saveAs(await zip.generateAsync({ type: "blob" }), "AI_Redpacket_Gold.zip");
                txt.innerText = "完成";
                setTimeout(() => { btn.disabled = false; txt.innerText = "生成并下载 ZIP"; }, 2000);
            } catch (err) {
                console.error('下载失败:', err);
                btn.disabled = false; txt.innerText = "失败，重试";
            }
        }

        window.onload = () => {
            render();
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    cards.forEach((d, i) => {
                        drawPattern(`canvas-${i}`);
                        if (d.type === 'chart-pie') drawPie(`pie-${d.bgSeed}`, d.data);
                    });
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                });
            });
        };
    </script>
</body>
</html>
