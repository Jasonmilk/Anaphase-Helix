<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书卡片生成器 - 赛博极客 V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* 1. 赛博配色定义 - 调色版 V2 */
        :root {
            --bg-dark: #050505; --card-surface: #0a0a0a; --neon-green-yellow: #ccff00; 
            --neon-amber: #ffbf00; --neon-pink: #ff007f; --cyber-blue: #00f3ff;
            --text-main: #ffffff; --text-muted: #a3a3a3; --border-dim: rgba(255, 255, 255, 0.15);
        }
        * { font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        body { background-color: #000; color: white; -webkit-font-smoothing: antialiased; }
        img, svg { display:inline-block !important; }
        /* 2. 卡片容器 */
        .card-container { width: 375px; height: 500px; background: var(--bg-dark); position: relative; overflow: hidden; padding: 1.5rem; display: flex; flex-direction: column; border: 1px solid #333; }
        .card-content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 0.5rem; }
        /* 3. 背景画布 */
        .bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        /* 4. 预览包装 */
        .preview-wrapper { box-shadow: 0 0 20px rgba(204, 255, 0, 0.05); border: 1px solid #444; transition: transform 0.3s ease; }
        /* 5. 装饰性标签 */
        .tag { display: inline-block; padding: 0.25rem 0.75rem; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); font-size: 10px; font-weight: 600; color: var(--text-main); margin: 0 0 0.35rem 0.35rem; border-radius: 4px; backdrop-filter: blur(5px); letter-spacing: 0.05em; }
        /* 6. 高级卡片组件 */
        .premium-card { background: rgba(25, 25, 25, 0.85); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); border: 1px solid var(--border-dim); border-radius: 12px; backdrop-filter: blur(10px); }
        .text-glow-green { text-shadow: 0 0 12px rgba(204, 255, 0, 0.4); }
    </style>
</head>
<body class="p-0 md:p-8 flex flex-col items-center min-h-screen">

    <!-- 顶部导航 -->
    <div class="fixed top-0 left-0 w-full bg-black/95 backdrop-blur-md z-50 p-4 flex justify-between items-center px-4 md:px-8 border-b border-white/10">
        <div class="flex items-center gap-3">
            <div>
                <h1 class="text-lg font-bold text-white tracking-tight font-mono">CYBER_GEN_V2.1</h1>
                <p class="text-xs text-[#ccff00] uppercase tracking-widest font-mono" id="top-subtitle">CORE_INITIALIZED</p>
            </div>
        </div>
        <button id="downloadBtn" onclick="downloadAll()" class="bg-[#ccff00] hover:bg-[#dfff4d] text-black px-6 py-2.5 rounded text-sm font-bold transition-all flex items-center gap-2 shadow-[0_0_20px_rgba(204,255,0,0.4)] font-mono">
            <span id="btnText">DOWNLOAD_AS_ZIP</span>
        </button>
    </div>

    <!-- 卡片展示区 -->
    <div id="cards-wrapper" class="mt-28 px-0 md:px-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10 max-w-7xl mx-auto"></div>
    <div class="h-20"></div>

    <script>
        const themeColors = { green: '#ccff00', amber: '#ffbf00', cyan: '#00f3ff', pink: '#ff007f' };
        const cards = [
            { type:'cover', title:"未来算力<br>与神经形态", subtitle:"2026 QUANTUM REPORT", author:"SYSTEM_X_ADMIN", tags:["#QUANTUM","#BIO_CHIP","#CYBER_TECH"], bgSeed:1, accent:themeColors.green },
            { type:'list', title:"系统参数", subtitle:"SYSTEM_METRICS", iconName:"activity", items:[{ label:"内核响应", value:"0.2ms", desc:"Hyper-threading core state stable" }, { label:"带宽利用", value:"94.1%", desc:"Encryption tunnels active" }], summary:"核心系统指标监控显示所有参数处于最优状态", bgSeed:2, accent:themeColors.cyan },
            { type:'chart-pie', title:"存储构成", subtitle:"STORAGE_ALLOCATION", iconName:"database", data:[{ label:"加密卷", value:65, color:themeColors.green }, { label:"冷备份", value:20, color:"#444" }, { label:"临时栈", value:15, color:"#666" }], summary:"加密存储占据主导地位，确保数据安全与高效访问", bgSeed:3, accent:themeColors.green },
            { type:'chart-comp', title:"编译器偏好", subtitle:"COMPILER_TRENDS", iconName:"code-2", data:[{ label:"Rust", value:50, highlight:true },{ label:"Go", value:30 },{ label:"C++", value:20 }], summary:"Rust以内存安全优势领跑，现代编译器生态正在重塑", bgSeed:4, accent:themeColors.amber },
            { type:'highlight', title:"算力节点", subtitle:"NODE_STATUS", iconName:"server", mainStat:"14.8P", mainStatDesc:"集群总算力峰值", subStats:[{ label:"能源效率比", value:"98.9%" }], summary:"分布式算力网络达到P级规模，能效比接近理论极限", bgSeed:5, accent:themeColors.green },
            { type:'vs', title:"架构演进", subtitle:"ARCH_CONTRAST", iconName:"git-compare", left:{ label:"Monolith", value:"Legacy", color:"#999" }, right:{ label:"Swarm", value:"V3.0", color:themeColors.amber }, summary:"架构范式转变：从单体到群智能的代际跨越", bgSeed:6, accent:themeColors.amber },
            { type:'list', title:"网络层级", subtitle:"NETWORK_LAYERS", iconName:"layers", items:[{ label:"L1 节点", value:"Active", desc:"Global sync completed" },{ label:"L2 链", value:"Verified", desc:"Zero-Knowledge proofs active" }], summary:"多层网络协议栈全面激活，零知识证明保障隐私", bgSeed:7, accent:themeColors.pink },
            { type:'stat-card', title:"安全预警", subtitle:"SECURITY_LOG", iconName:"shield-alert", stat:"LEVEL 5", statLabel:"INTRUSION DETECTED", summary:"高级别入侵检测触发，防御系统已自动响应并重组", bgSeed:8, accent:themeColors.amber },
            { type:'list-rank', title:"资产排行", subtitle:"ASSET_INDEX", iconName:"bar-chart-3", items:[{ rank:1, label:"Encrypted Data", value:"CRITICAL" },{ rank:2, label:"Logic Units", value:"HIGH" },{ rank:3, label:"Bandwidth", value:"MED" }], summary:"核心数字资产优先级排序，数据加密资产居首位", bgSeed:9, accent:themeColors.pink },
            { type:'summary', title:"SYSTEM_EXIT", subtitle:"LOG_OUT_READY", text:"在这场无限的游戏中，唯一不变的是变异的速度。代码即法律，而你是最终的解释者。", footer:"2026 ENCRYPTED LOGS", bgSeed:10, accent:themeColors.green }
        ];

        function drawPattern(id, seed, accentColor) {
            const canvas = document.getElementById(id); if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 2;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr; canvas.height = rect.height * dpr; ctx.scale(dpr, dpr);
            ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, rect.width, rect.height);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)'; ctx.lineWidth = 1;
            const gridSize = 30;
            for (let x = 0; x <= rect.width; x += gridSize) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, rect.height); ctx.stroke(); }
            for (let y = 0; y <= rect.height; y += gridSize) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(rect.width, y); ctx.stroke(); }
            const drawGlow = (x, y, r, color) => {
                const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                let rgba = 'rgba(204, 255, 0, 0.15)';
                if (color === themeColors.amber) rgba = 'rgba(255, 191, 0, 0.15)';
                else if (color === themeColors.cyan) rgba = 'rgba(0, 243, 255, 0.15)';
                else if (color === themeColors.pink) rgba = 'rgba(255, 0, 127, 0.15)';
                g.addColorStop(0, rgba); g.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
            };
            (seed % 2 === 0) ? drawGlow(rect.width * 0.9, rect.height * 0.1, rect.width * 1.2, accentColor) : drawGlow(rect.width * 0.1, rect.height * 0.9, rect.width * 1.2, accentColor);
            ctx.fillStyle = accentColor; ctx.globalAlpha = 0.3;
            for (let i = 0; i < 15; i++) { ctx.fillRect(Math.random() * rect.width, Math.random() * rect.height, Math.random() * 4 + 1, 0.5); }
            ctx.globalAlpha = 1.0;
        }

        function drawPie(id, data, accent) {
            const canvas = document.getElementById(id); if (!canvas) return; 
            const ctx = canvas.getContext('2d'); 
            const cx = canvas.width / 2, cy = canvas.height / 2, r = Math.min(canvas.width, canvas.height) / 2 - 20; 
            const total = data.reduce((s, i) => s + i.value, 0);
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); 
            ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 16; ctx.stroke();
            let startAngle = -Math.PI / 2; 
            data.forEach(item => { 
                const slice = (item.value / total) * 2 * Math.PI; 
                ctx.beginPath(); ctx.arc(cx, cy, r, startAngle, startAngle + slice - 0.12);
                ctx.strokeStyle = item.color; ctx.lineWidth = 16; ctx.lineCap = 'butt'; ctx.stroke(); 
                startAngle += slice; 
            });
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 24px "JetBrains Mono"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; 
            ctx.fillText(data[0].value + '%', cx, cy);
        }

        const tpl = {
            cover: d => `
                <div class="h-full flex flex-col justify-center relative items-end text-right">
                    <div class="space-y-6">
                        <div class="flex justify-end">
                            <div class="w-10 h-10 border border-[${d.accent}] flex items-center justify-center mb-4">
                                 <div class="w-5 h-5" style="background:${d.accent}; box-shadow: 0 0 10px ${d.accent}"></div>
                            </div>
                        </div>
                        <h1 class="text-5xl font-bold leading-[1.1] tracking-tighter" style="color: ${d.accent}; text-shadow: 0 0 15px ${d.accent}99, 0 0 30px ${d.accent}44;">
                            ${d.title}
                        </h1>
                        <p class="text-xs font-mono text-[${d.accent}] tracking-[0.2em] uppercase border-r-2 pr-4" style="border-color:${d.accent}">
                            ${d.subtitle}
                        </p>
                        <div class="pt-8 border-t border-white/20 mt-8">
                            <div class="flex flex-wrap gap-2 justify-end">
                                ${d.tags.map(t => `<span class="tag" style="border-color:${d.accent}; color:${d.accent}; margin:0 0 0.35rem 0;">${t}</span>`).join('')}
                            </div>
                            <p class="text-xs text-gray-400 mt-5 font-mono tracking-widest uppercase opacity-80">ID: ${d.author}_</p>
                        </div>
                    </div>
                </div>`,
            
            summary: d => `
                <div class="h-full flex flex-col pt-4">
                    <h2 class="text-3xl font-bold text-white mb-6 tracking-tight font-mono" style="color:${d.accent}">// ${d.title}</h2>
                    <div class="flex-grow flex items-center">
                        <p class="text-lg text-gray-200 leading-relaxed font-light font-mono border-l-2 border-white/10 pl-4 py-2">${d.text}</p>
                    </div>
                    <div class="border-t border-white/20 pt-4 flex justify-between items-center bg-black/40 p-3 mt-4 rounded-lg">
                        <span class="text-xs font-bold uppercase tracking-widest" style="color: ${d.accent}">● COMPLETE</span>
                        <span class="text-xs text-gray-400 font-mono">${d.footer}</span>
                    </div>
                </div>`,
            
            list: d => `
                <div class="space-y-3">
                    ${d.items.map(i => `
                        <div class="premium-card p-4 flex flex-col gap-1 border-l-2" style="border-left-color:${d.accent}">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-bold text-gray-100 font-mono uppercase">${i.label}</span>
                                <span class="text-sm font-bold font-mono" style="color:${d.accent}">${i.value}</span>
                            </div>
                            ${i.desc ? `<div class="text-xs text-gray-400 leading-relaxed pt-1 font-mono">${i.desc}</div>` : ''}
                        </div>
                    `).join('')}
                </div>`,
            
            'chart-pie': d => `
                <div class="flex items-center justify-center" style="height: 70%;">
                    <div class="grid grid-cols-3 gap-3 items-center w-full h-full">
                        <div class="flex flex-col items-start justify-center space-y-4 z-10 h-full">
                            ${d.data.slice(0, Math.ceil(d.data.length / 2)).map(i => `<div class="inline-flex items-center gap-2 px-2 py-1 bg-black/60 border border-white/10 rounded text-xs"><span class="w-2 h-2" style="background:${i.color}"></span><span class="font-bold text-white font-mono">${i.value}%</span></div>`).join('')}
                        </div>
                        <div class="flex items-center justify-center z-0 h-full relative">
                            <canvas id="pie-${d.bgSeed}" width="160" height="160"></canvas>
                        </div>
                        <div class="flex flex-col items-end justify-center space-y-4 z-10 h-full">
                            ${d.data.slice(Math.ceil(d.data.length / 2)).map(i => `<div class="inline-flex items-center gap-2 px-2 py-1 bg-black/60 border border-white/10 rounded text-xs"><span class="w-2 h-2" style="background:${i.color}"></span><span class="font-bold text-white font-mono">${i.value}%</span></div>`).join('')}
                        </div>
                    </div>
                </div>`,
            
            'chart-comp': d => `
                <div class="pt-2">
                    <div class="flex items-end justify-center gap-5 h-44 mb-6 px-1 border-b border-white/10 pb-4">
                        ${d.data.map(i => `
                            <div class="flex flex-col items-center gap-2">
                                <div class="text-xs font-bold font-mono ${i.highlight ? 'text-white' : 'text-gray-400'}">${i.value}%</div>
                                <div class="w-12 relative transition-all duration-300" style="height:${Math.max(12, i.value * 2.6)}px; background:${i.highlight ? d.accent : '#222'}; border:1px solid ${i.highlight ? d.accent : '#333'}\">${i.highlight ? `<div class="absolute inset-0 opacity-40" style="box-shadow: 0 0 15px ${d.accent}\"></div>` : ''}</div>
                                <div class="text-xs font-bold text-gray-400 font-mono uppercase tracking-widest text-center w-20">${i.label}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>`,
            
            highlight: d => `
                <div class="h-full flex flex-col justify-center">
                    <div class="premium-card p-10 text-center bg-gradient-to-br from-[#151515] to-black">
                        <div class="text-6xl font-bold font-mono" style="color:${d.accent}; text-shadow:0 0 25px ${d.accent}88">${d.mainStat}</div>
                        <div class="text-xs text-gray-300 uppercase tracking-[0.4em] font-bold border-t border-white/10 pt-5 mt-4 w-full">${d.mainStatDesc}</div>
                    </div>
                    <div class="mt-4 flex flex-col gap-2">
                        ${d.subStats.map(s => `<div class="flex justify-between items-center px-4 py-3 bg-[#0d0d0d] border border-white/10"><span class="text-xs text-gray-400 font-mono uppercase tracking-widest">${s.label}</span><span class="text-xs font-bold text-white font-mono">${s.value}</span></div>`).join('')}
                    </div>
                </div>`,
            
            vs: d => `
                <div class="flex flex-col gap-4 pt-2">
                    <div class="premium-card p-6 flex justify-between items-center border border-white/10">
                        <span class="text-xs font-bold text-gray-400 tracking-widest font-mono uppercase">${d.left.label}</span>
                        <span class="text-2xl font-bold font-mono" style="color: ${d.left.color}">${d.left.value}</span>
                    </div>
                    <div class="flex justify-center -my-5 relative z-20">
                        <div class="bg-black border-2 px-4 py-1 text-lg font-extrabold font-mono" style="color:${d.accent}; border-color:${d.accent}; box-shadow: 0 0 15px ${d.accent}88">VS</div>
                    </div>
                    <div class="premium-card p-6 flex justify-between items-center border-l-4" style="border-left-color:${d.accent}">
                        <span class="text-xs font-bold text-white tracking-widest font-mono uppercase">${d.right.label}</span>
                        <span class="text-2xl font-bold font-mono" style="color: ${d.right.color}">${d.right.value}</span>
                    </div>
                </div>`,
            
            'stat-card': d => `
                <div class="flex flex-col h-full py-2 gap-4">
                    <div class="premium-card p-8 text-center bg-gradient-to-br from-[#151515] to-black">
                        <div class="text-6xl font-bold text-white leading-none font-mono" style="color:${d.accent}; text-shadow:0 0 20px ${d.accent}55">${d.stat}</div>
                        <div class="text-xs text-gray-300 uppercase tracking-[0.4em] font-bold border-t border-white/10 pt-5 mt-4 w-full">${d.statLabel}</div>
                    </div>
                </div>`,
            
            'list-rank': d => `
                <div class="space-y-3">
                    ${d.items.map(i => `
                        <div class="p-4 flex items-center gap-5 bg-white/[0.04] border border-white/10 hover:border-white/20">
                            <div class="text-lg font-bold font-mono italic" style="color:${i.rank === 1 ? d.accent : '#555'}">#0${i.rank}</div>
                            <div class="flex-1">
                                <div class="text-xs font-bold text-white font-mono uppercase tracking-tight">${i.label}</div>
                            </div>
                            <div class="text-xs font-bold font-mono text-[${d.accent}] opacity-100">${i.value}</div>
                        </div>
                    `).join('')}
                </div>`
        };

        function render() {
            const wrapper = document.getElementById('cards-wrapper');
            wrapper.innerHTML = cards.map((d, i) => {
                const isCover = d.type === 'cover';
                const isSummary = d.type === 'summary';
                let headerHtml = '';
                if (!isCover && !isSummary) {
                    headerHtml = `<div class="flex items-center gap-2 mb-6 pb-4 border-b border-white/20"><div style="color:${d.accent}"><i data-lucide="${d.iconName || 'hash'}" class="w-5 h-5"></i></div><h2 class="text-xs font-bold text-gray-400 uppercase tracking-[0.25em] flex-1 font-mono">${d.subtitle}</h2></div>`;
                }
                
                // 为所有卡片生成统一样式的页脚
                let footerHtml = '';
                if (!isCover && !isSummary && d.summary) {
                    // 中间卡片：有总结
                    footerHtml = `
                        <div class="mt-auto pt-4 space-y-2">
                            <div class="text-xs text-gray-300 leading-relaxed font-mono">${d.summary}</div>
                            <div class="flex justify-between items-end">
                                <span class="text-xs font-bold tracking-widest text-gray-400 uppercase font-mono">未来算力与神经形态</span>
                                <span class="text-xs font-mono text-gray-400">P${String(i+1).padStart(2,'0')}</span>
                            </div>
                        </div>
                    `;
                } else if (isCover || isSummary) {
                    // 封面和尾页：无总结，只有标题和页码
                    footerHtml = `
                        <div class="mt-auto pt-4">
                            <div class="flex justify-between items-end">
                                <span class="text-xs font-bold tracking-widest text-gray-400 uppercase font-mono">未来算力与神经形态</span>
                                <span class="text-xs font-mono text-gray-400">P${String(i+1).padStart(2,'0')}</span>
                            </div>
                        </div>
                    `;
                }
                
                return `
                    <div class="preview-wrapper">
                        <div class="card-container" id="card-${i}">
                            <canvas id="canvas-${i}" class="bg-canvas"></canvas>
                            <div class="card-content">
                                <div>
                                    ${headerHtml}
                                    ${tpl[d.type](d)}
                                </div>
                                ${footerHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            requestAnimationFrame(() => {
                document.getElementById('top-subtitle').textContent = "PROTOCOL_ACTIVE";
                cards.forEach((d, i) => {
                    drawPattern(`canvas-${i}`, d.bgSeed, d.accent);
                    if (d.type === 'chart-pie') drawPie(`pie-${d.bgSeed}`, d.data, d.accent);
                });
                lucide.createIcons();
            });
        }

        async function downloadAll() {
            const btn = document.getElementById('downloadBtn');
            const txt = document.getElementById('btnText');
            const originalText = txt.innerText;
            btn.disabled = true; btn.style.opacity = "0.5";
            txt.innerText = "PACKING...";
            try {
                const zip = new JSZip();
                const els = document.querySelectorAll('.card-container');
                for (let i = 0; i < els.length; i++) {
                    const canvas = await html2canvas(els[i], { scale: 3, backgroundColor: '#050505' });
                    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
                    zip.file(`CyberV2_Card_${i+1}.png`, blob);
                }
                const content = await zip.generateAsync({ type: "blob" });
                saveAs(content, "Cyber_V2_Pack.zip");
                txt.innerText = originalText;
                btn.disabled = false; btn.style.opacity = "1";
            } catch (err) {
                alert("ERR_PACK_FAILED");
                btn.disabled = false; txt.innerText = originalText;
            }
        }
        window.onload = render;
    </script>
</body>
</html>
