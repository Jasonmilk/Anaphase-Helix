# 全能微信公众号写手配置模板
# 版本: v3.0 (全能版）

# ==================== 行业配置 ====================
industry:
  name: "科技"  # 行业名称（可修改为：教育/电商/美食/金融/旅行等）

  # 行业标签（3-5个，将显示在文章中）
  tags:
    - "科技前沿"
    - "AI创新"
    - "效率工具"

  # 行业描述（用于内容生成的背景）
  description: "关注科技动态、产品创新和实用工具"

# ==================== 目标受众 ====================
audience:
  # 主要受众
  primary: "职场人士"
  # 次要受众
  secondary: "创业者"
  # 受众描述
  description: "关注行业动态和实用工具，希望提升效率"

# ==================== 内容模块开关 ====================
# 根据您的公众号类型选择需要的模块
modules:
  headline: true       # 今日头条（必选）
  sub_news: true       # 行业要闻（新闻合集必选）
  data_charts: true    # 数据与榜单（可选）
  tools: true         # 宝藏工具（推荐）
  daily_quote: true    # 每日一言（推荐）

# ==================== 字数配置 ====================
word_count:
  # 总字数范围
  min: 1200
  max: 3000

  # 头条字数范围
  headline_min: 800
  headline_max: 1500

  # 行业要闻每条字数
  sub_news_item_max: 150

  # 栏目文章字数（扩展期）
  article_min: 1500
  article_max: 3000

# ==================== 风格配置 ====================
style:
  # 语气风格：严肃/专业/幽默/亲和/温暖
  tone: "专业+亲切"

  # 图片风格：现代简约/科技感/温馨/商务/艺术
  image_style: "现代简约+科技感"

  # 色彩主题：温暖/冷色/商务/多彩/黑白
  color_theme: "温暖"

  # 主色调（十六进制，可选）
  primary_color: "#ff6b35"

  # 辅助色（十六进制，可选）
  secondary_color: "#667eea"

# ==================== 敏感词配置 ====================
# 可添加行业特定的敏感词（与系统内置敏感词合并）
sensitive_keywords: []
  # 示例：
  # - "特定行业敏感词1"
  # - "特定行业敏感词2"

# ==================== 打分权重配置 ====================
scoring_weights:
  # 选题打分权重
  heat: 0.5         # 热度权重
  relevance: 0.35    # 相关度权重
  emotion: 0.15      # 情绪权重

  # 标题打分权重
  clarity: 0.3       # 明确度权重
  benefit: 0.3       # 利益点权重
  urgency: 0.2       # 紧迫性权重
  compliance: 0.2    # 合规性权重

# ==================== 产能节奏 ====================
production:
  # 阶段1：稳定期
  stable_phase:
    articles_per_day: 1  # 每天文章数
    duration_days: 14      # 持续天数

  # 阶段2：扩展期（稳定期完成后自动启用）
  expansion_phase:
    articles_per_day: 2  # 每天文章数（新闻合集+栏目文章）
    enable_when_stable: true

# ==================== 输出配置 ====================
output:
  # 输出目录
  dir: "./outputs/公众号草稿"

  # 文件命名格式
  naming_format: "{date}_第{issue}期.html"
  date_format: "%Y-%m-%d"

# ==================== 数据库配置 ====================
database:
  # 历史库路径
  history_db: "./data/shared_state/history_log.db"

  # 查重天数窗口
  duplicate_check_days: 5

  # 数据保留天数
  data_retention_days: 5

# ==================== 图片配置 ====================
image:
  # 头图尺寸
  header:
    width: 900
    height: 383

  # 内容图最大宽度
  content_max_width: 1200

  # 图片最大大小（KB）
  max_size_kb: 500

  # 图片格式
  formats:
    - "jpg"
    - "png"

# ==================== 质量检查配置 ====================
quality_check:
  # 是否启用各维度检查
  enable_structure: true      # 结构检查
  enable_facts: true         # 事实检查
  enable_html_compliance: true # HTML合规检查
  enable_content_duplicate: true # 内容重复检查
  enable_history_duplicate: true # 历史查重检查
  enable_image_check: true    # 图片合规检查

  # 内容重复相似度阈值
  duplicate_similarity_threshold: 0.8

# ==================== HTML模板配置 ====================
html_template:
  # 模板路径
  path: "./references/html_template_v2.1.html"

  # 是否使用内联样式（强制true）
  inline_style: true

  # 是否允许JavaScript（强制false，公众号不支持）
  allow_javascript: false

  # 是否允许外部CSS（强制false，公众号不支持）
  allow_external_css: false

# ==================== 追踪指标配置 ====================
metrics:
  # 增长指标
  growth:
    track_views: true        # 阅读量
    track_completion: true    # 阅读完成率
    track_save: true         # 收藏率
    track_share: true        # 分享率
    track_like: true         # 在看率
    track_follow: true       # 转粉率

  # 线索指标
  leads:
    track_menu_click: true   # 菜单点击
    track_reply_click: true  # 自动回复点击
    track_end_link: true     # 文末引导点击
    track_private_add: true  # 私域加粉
    track_consult: true      # 咨询数
    track_deals: true        # 成交线索

