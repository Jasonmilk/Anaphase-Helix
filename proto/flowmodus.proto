syntax = "proto3";

package flowmodus;

// The FlowModus service — deterministic LLM scheduling engine.
// Anaphase calls this service for all LLM reasoning tasks.
service FlowModus {
    // Send a reasoning request and receive a text response.
    rpc Reason(ReasonRequest) returns (ReasonResponse);
}

message ReasonRequest {
    // The prompt text to send to the LLM.
    string prompt = 1;
    // The cognitive mode requested by Anaphase:
    // "auto" = let FlowModus decide (default)
    // "left_brain" / "right_brain" / "cerebellum" = specific routing hints
    //
    // Tag 2 keeps this meaning; only the NAME changed. It used to be called
    // `model`, which is what let two repos disagree about the same field without
    // either of them erroring (measured 2026-09-24).
    string cognitive_mode = 2;
    // The model the caller asks for, by registry model id (e.g. `mock-chat-1`).
    // Empty = let FlowModus route it (Auto). Anaphase fills this from
    // `reasoning_model`; without it the model a caller declared never reached
    // the router, so routing silently fell back to whatever Auto preferred.
    string model = 4;
    // Maximum tokens to generate (default: 2048)
    uint32 max_tokens = 3;
}

message ReasonResponse {
    // The generated text response.
    string content = 1;
    // RETIRED (was `uint32 tokens_consumed = 2`).
    //
    // A derived TOTAL cannot rebuild a breakdown, and Anaphase's `UsageSnapshot`
    // has no field for one: it stores disjoint counts and its own parser refuses
    // a total-only usage object outright (`adapters/usage.rs`: "`total_tokens`
    // alone is not enough — it is deliberately not read", with a test asserting
    // it). Keeping the field would therefore have forced whoever wired the
    // metering leg to put a sum into `prompt_tokens` — a fabricated measurement,
    // which is K-115's fault wearing new clothes. So it is reserved, not reused.
    reserved 2;
    reserved "tokens_consumed";
    // The model that ACTUALLY served the request — the routed fact, not the
    // caller's declared name (ADR-0036). Empty when the upstream did not say.
    string model = 3;
    // What the round trip cost, as the upstream reported it. Absent = it reported
    // no usage at all; Anaphase then writes no `assistant/usage` row rather than a
    // fabricated zero (ADR-0038).
    Usage usage = 4;
}

// The upstream's usage facts, DISJOINT — exactly the shape Anaphase stores.
// `cached_tokens` / `reasoning_tokens` are explicitly optional so "not reported"
// stays distinct from "reported zero"; a plain uint64 cannot express that.
message Usage {
    uint64 prompt_tokens = 1;
    uint64 completion_tokens = 2;
    optional uint64 cached_tokens = 3;
    optional uint64 reasoning_tokens = 4;
}
