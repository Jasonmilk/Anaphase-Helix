syntax = "proto3";

package flowmodus;

// The FlowModus service — deterministic LLM scheduling engine.
// Anaphase calls this service for all LLM reasoning tasks.
service FlowModus {
    // Send a reasoning request and receive a text response.
    rpc Reason(ReasonRequest) returns (ReasonResponse);
}

message ReasonRequest {
    // The prompt text to send to the LLM.
    string prompt = 1;
    // The cognitive mode requested by Anaphase:
    // "auto" = let FlowModus decide (default)
    // "left_brain" / "right_brain" / "cerebellum" = specific routing hints
    //
    // Tag 2 keeps this meaning; only the NAME changed. It used to be called
    // `model`, which is what let two repos disagree about the same field without
    // either of them erroring (measured 2026-09-24).
    string cognitive_mode = 2;
    // The model the caller asks for, by registry model id (e.g. `mock-chat-1`).
    // Empty = let FlowModus route it (Auto). Anaphase fills this from
    // `reasoning_model`; without it the model a caller declared never reached
    // the router, so routing silently fell back to whatever Auto preferred.
    string model = 4;
    // Maximum tokens to generate (default: 2048)
    uint32 max_tokens = 3;
}

message ReasonResponse {
    // The generated text response.
    string content = 1;
    // Number of tokens consumed (for energy tracking).
    uint32 tokens_consumed = 2;
    // The model that ACTUALLY served the request — the routed fact, not the
    // caller's declared name (ADR-0036). Empty when the upstream did not say.
    // Without it a turn cannot report which supplier answered, so the panel's
    // 证轨 shows `model: null` for a turn that succeeded.
    string model = 3;
}
