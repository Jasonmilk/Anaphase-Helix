name: CI

on:
  push:
    branches: [ main, V4 ]
  pull_request:
    branches: [ main, V4 ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"
      - name: Lint
        run: |
          source .venv/bin/activate
          ruff check .
      - name: Test
        run: |
          source .venv/bin/activate
          pytest -v --cov=ana
