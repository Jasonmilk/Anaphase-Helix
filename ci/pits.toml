[[pit]]
id       = "H2b"
recorded = "2026-09-18"
summary  = "safety_rules is static, not runtime-loadable. The field comment claimed it was read from memory (L2) and there was no loader anywhere — no config field, no reader, no writer; the only assignment was a literal in main.rs. If it were updatable, poisoned memory could disarm the deny-list, which is the one single point that bypasses every other measure (K-033)"

[[pit]]
id       = "K-044"
recorded = "2026-09-20"
summary  = "The security gate had no door on the production path. Measured: with_security_gate is called only from tests/, PipelineConfig defaults the field to None, src/main.rs never installs one, and tuck-core is a dev-only dependency — so every tool call executed ungated while security.rs described None as harmless 'legacy behavior'. The emergency-pass variant's comment claimed (audited) with no check behind it, and the peer surface the design assumes did not exist: Tuck serves the gate as a library API and its gateway exposes no route for a decision. Fifth instance of 'the real gap is the one not on the list'"

[[pit]]
id       = "B7"
recorded = "2026-09-18"
summary  = "Absence of a security gate was permission. The pipeline consulted `security_gate` only when it was `Some`, so with `None` every call executed — including high-risk ones. `None` was documented as benign 'legacy behaviour' while meaning 'no door', which is how the production path ran ungated (K-044). B7 makes absence fail-closed for high-risk calls, with `PermissiveGate` as the explicit, visible opt-out. First written down in commonintents/.github at e1fad63 (2026-09-18); the fix landed 2026-09-20, so the pit demonstrably precedes it"

[[pit]]
id       = "K-045"
recorded = "2026-09-20"
summary  = "The body dropped a fact that was already on the wire. Mind negotiates the run mode (`negotiate_mode`: impasse>=2 -> Anchor, >=4 -> Imagination, autonomy=Survival -> Skilled only) and returns `effective_mode` + `mode_negotiation` as `HelixQueryResult` fields 1-2; Anaphase's `QueryResult` had neither, so neither the panel nor the ProveTrack could say which mode a loop ran in — nor tell the mode the body ASKED for from the mode that RAN, which is the only record of Mind exercising its will over the body's suggestion (VISION 原则 3). Two corrections belong to this pit: (a) my first diagnosis said the fields were missing from the wire and edited `QueryResponse` — they were not missing; `HelixQueryResult` had them all along, and I had read the wrong message. The `QueryResponse` addition is kept because `Query`/`AdvancedQuery` drop the same fact on their own paths, but it was made on a wrong diagnosis and must not be cited as the fix. (b) `allow_imagination` on the body side is derived from the body's own suggestion (`suggested_mode == Imagination`), which makes the suggestion a veto and contradicts Mind's right to choose"

[[pit]]
id       = "K-059"
recorded = "2026-09-20"
summary  = "The reported mode and the executed mode could disagree. `stage_local_dominant` hardcoded `for_mode(CognitiveMode::Skilled, ..)` and its own comment said why: '`negotiate_mode` has not run yet (it is called after this stage)'. The mode was negotiated last while every stage fixed its own parameters, and three things followed: (1) two of `for_mode`'s three arms — `alpha_anchor`, `alpha_imagination`, `decay_imagination` — were config knobs with no consumer on the query path, so Anchor's wider radius and Imagination's soft-edge-led spread never ran; (2) `effective_mode: Imagination` was reported to the body while stage 1 diffused with alpha 0.5 and soft edges disabled, so the Provenance would have recorded a decision that never executed — a tag, not a run; (3) an empty start-node set returned a hardcoded `Anchor`, telling the body 'Mind chose Anchor' when Mind had chosen otherwise. Fixed by lifting `negotiate_mode` above retrieval (a pure reordering: it reads `current_impasse`, taken before retrieval, so every prior output is reproduced exactly), dispatching stage 1 to each mode's own traverse, and reporting the negotiated mode on the degenerate path. Mutation evidence: restoring `for_mode(CognitiveMode::Skilled, ..)` turns `the_reported_mode_is_the_mode_that_diffuses` red. The lever is soft edges — `decay_factor` multiplies soft-edge weight and Skilled's `SOFT_EDGES_DISABLED = 0.0` zeroes it, so a node reachable only through a soft edge is unreachable for Skilled; the storage-side test `skilled_mode_disables_soft_edges_entirely` independently holds the other half. This also closes K-045(b): `allow_imagination` was `suggested_mode == Imagination`, issued by the body to itself and inverted by length-based suggestions — a short query saying 「探索」 was the one case that could not reach Imagination — and is now derived from the human's own wording via the same `explore_keywords` that `derive_budget_tier` already trusts. Recorded first in commonintents/.github at 5966d42 (2026-09-20); the fix window arrived in a later commit, so the pit demonstrably precedes it"

[[pit]]
id       = "K-112"
recorded = "2026-09-21"
summary  = "Tuck and Anaphase share one collapse: an Option gate that leaves no record when it is absent, so 'no gate installed' and 'a gate that permitted' were the same observation. Anaphase side (fixed under this id): `Pipeline::gate_presence()` emits one stage-3 `gate` event per call (`gate=none` / `gate=<type>`), readable by production consumers through GET /v1/agent/events, which already reports `dropped`. Tuck side (NOT fixed, and not to be fixed unilaterally): `GatewayState.access: Option<AccessTable>` defaults to None behind a feature flag, the setter `with_access` is called only from tests, `gov.rs` consumes it with a silent `if let` that records only on Deny, and `tests/access_gate_test.rs:82-86` pins 'an absent gate must not deny anything'. Making absence observable there needs no policy change (record-only, no decision path touched), but reversing that pinned assertion would be a policy change. Correcting an earlier wording of this entry: the two invariants are NOT mutually exclusive -- Tuck's assertion is about the action, Anaphase's about the record, and recording without denying satisfies both. Also recorded: the source comment at `crates/tuck-gateway/src/state.rs:78-83` already distinguishes None (abstain) from an empty table (deny everything), so the intent is evidenced; and neither side has a runtime path that removes a gate, so 'never installed' vs 'stripped' is not a distinguishing input today"

[[pit]]
id       = "K-113"
recorded = "2026-09-21"
summary  = "The trace exhibit lacked the integrity constraints that make it citable. Measured first-hand on the real 10-period chain (70 ev rows, 20 distinct timestamps): the SAME rows in a different arrival order rendered `span: -428.0s` and `not attributed to any row: -525.0s`, i.e. a complete-looking document whose two headline numbers were subtraction artefacts. Root cause: `span()` subtracted the last row's timestamp from the first, so the result depended on arrival order. Repaired two ways, both asserted with controls: the arithmetic now takes min/max so the endpoints and the difference cannot depend on order, and `assertTimeOrdered()` refuses an out-of-order stream at the markdown() door instead of silently re-sorting it -- re-sorting would hide exactly the fact the document exists to expose. All 162 event files on disk are in time order, so the defect was latent, which is why the guard is built rather than the data fixed. Same id also covers the seventh instance of the declared-vs-actual coverage shape: the export declared the kinds it does not draw from the CONTRACT table only, while the window is merged from files written by more than one process, so a kind in neither table was dropped upstream and the declaration said nothing; the document now names what it actually dropped and the session's carrier kinds are a named list. Two further findings are recorded under this id and are NOT fixed: (a) a dangling-reference scan of the PRAGMA foreign_key_check form was requested but the carrier could not be located in this workspace -- `checks:` appears in no first-party code, and this export renders no check rows, so no assertion was invented for it; (b) Cellrix's live-panel suite `all_views_test.js` consumes the build inside the running web process, and that process was measured stale (started 2026-09-20 01:44, export asset edited 15:27, served page containing none of the batch's export changes), so its reds describe an old build -- the served page carries no build identity, so staleness cannot currently be detected mechanically. Writing the dropped-kind assertion also produced two instructive reds: the checker's own blind spot (the carrier kind `ev` reported as dropped data) and a control that could never fail because `buildSession` filters upstream of the export, which was moved to `validateTables` where the real failure mode lives"

[[pit]]
id       = "K-115"
recorded = "2026-09-21"
summary  = "`context/inject` recorded the BUDGET as if it were the fact. `chars` was passed `memory_inject_chars` — the configured ceiling — so a reader could not tell what injection actually contributed. Measured in this workspace's own exports: `nodes` varied 0/6/12/20 across periods while `chars` stayed 800 in all of them, and `chars` had no consumer anywhere in the Rust side, which is why nobody noticed. This is the fourth instance of a configured value standing in for a measured one (after `heat 0.5`, `HEARTBEAT_INTERVAL_SECS=19`, and a hardcoded `Anchor`). Fixed by adding `injected_chars` BESIDE the budget rather than redefining `chars`: renaming what an existing field means would be this project's own one-word-two-meanings fault, and both facts are worth keeping — what was allowed, and what was contributed. The value is computed from the fold that already happened, not re-derived, and is `Option` so \"no measurement\" stays distinct from \"measured zero\". Contract-side the field is registered as optional in the event-family table (`event_family.js`), so events written before it remain valid"

[[pit]]
id       = "K-116"
recorded = "2026-09-21"
summary  = "A tool-free round's `assistant/attempt` repeated its `assistant/reply` word for word, so the same text appeared twice in one chain and a reader could reasonably conclude two things had happened. The mechanism was right where it was exercised: a tool round's attempt already says `planned calls: weather/calc`, which is a statement about what was ATTEMPTED and is independent of the answer. Only the tool-free path echoed the payload, because the event simply carried `output` — the model's raw response — for both cases. Fixed by naming the decision instead of restating the deliverable: `no calls planned — answered directly`. The reply is not lost, it is carried by REPLY, which is its job. No contract field changed (`attempt.text` is still a string) and no consumer needed updating; the duplication was in the value, not the shape"

[[pit]]
id       = "K-118"
recorded = "2026-09-22"
summary  = "The approval channel could not express `we could not ask`, so callers had to guess. `GateVerdict` is two-valued (`Cleared` / `Refused`) and `OnAuditError::{ReportSuccess, Block}` makes the CALL SITE pick which way an unrunnable audit falls — the structured path reports success, the legacy path blocks, for the same physical situation (K-033). `ApproveFn` is a synchronous `Fn(..) -> Result<bool, String>`, so `no channel` and `human said no` collapse into adjacent values that every caller then folds into one `TransitionCondition`. First-hand: `src/hitl.rs` has no type that can distinguish approved-once / rejected / cancelled / unavailable. This id covers the A5 work item: an `ApprovalOutcome` closed set (four values, only one of which grants), a `WaitMode` presentation parameter that carries no security meaning, an awaitable answer channel reusing the existing `self.hitl` path, and a scoped standing policy so N planned calls do not become N prompts. Registered ahead of implementation because the first step needs a `fix_window`, and a window whose k_id is unlisted is refused (order enforced, not stylistic)"

[[pit]]
id       = "K-120"
recorded = "2026-09-24"
summary  = "`ReasonRequest.model` carried two different facts at once, and both repos were internally consistent about it, so neither errored. The proto documents field 2 as the COGNITIVE MODE (\"auto / left_brain / right_brain / cerebellum\"); FlowModus read it that way (`mode_to_role`, `cognitive_mode`). Anaphase's adapter took a parameter NAMED `model` and its only caller passed `reasoning_mode` into it. So the model a caller declared never reached the router, and routing fell back to whatever Auto preferred. Measured end to end: with a working free supplier registered (`mock-llm` -> a local deterministic upstream) and the CLI proving the route resolves (`supplier=mock-llm endpoint=http://127.0.0.1:59099/v1 cost_usd=0`), EVERY turn still called agnes-ai and died on 403. This is the same fault this repository already names twice over — a configured value standing in for a measured one (K-115) and one word carrying two meanings — but here it cost several rounds of diagnosis because the symptom (`model: null`, `impasse`, no upstream call) reads exactly like a missing credential. I recorded that wrong conclusion in three successive reports before finding it. Fixed by giving each fact its own wire field: tag 2 keeps its meaning and is renamed `cognitive_mode`, and a new tag 4 `model` carries the model id. The fix needs lines in `src/adapters/flowmodus.rs`, which is already 5 over its own ratchet, so it opens a bounded window rather than silently widening it."

[[pit]]
id       = "K-121"
recorded = "2026-09-24"
summary  = "The gRPC reasoning adapter never overrode `last_meta()`, so the two facts the upstream response carries — which model actually served the call, and what it cost — were dropped on the floor. `emit_usage` saw `usage: None` and therefore wrote no `assistant/usage` row at all, and a turn that had SUCCEEDED still reported `model: null` in the 证轨. The consequence is not cosmetic: the whole point of recording provenance is being able to tell which layer answered, and the absence was indistinguishable from an upstream that simply reported nothing. Fixing it exposed a second, deeper problem in the same leg: `ReasonResponse` carried only `tokens_consumed`, a DERIVED TOTAL, while Anaphase's `UsageSnapshot` stores disjoint counts and its parser REFUSES a total-only object by design (`adapters/usage.rs` asserts `parse_usage({\"total_tokens\":10})` is None). So the wire field could not honestly fill the struct it was meant to fill — anyone wiring it would have had to put a sum into `prompt_tokens`, which is a fabricated measurement and is exactly K-115's fault (a configured value standing in for a measured one). Fixed by carrying the disjoint facts across the wire (`Usage` submessage with explicitly-optional cached/reasoning counts, and the lossy `tokens_consumed` reserved rather than reused) and by having the adapter record what it saw, the same way the HTTP adapter already did. Measured end to end against the local deterministic upstream: `assistant/usage {prompt_tokens: 3, completion_tokens: 4, cached_tokens: null, reasoning_tokens: null, model: mock-chat-1}`, with the nulls staying null rather than becoming zeros."
