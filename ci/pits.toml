recorded = "2026-09-18"
summary  = "A runtime counter reporting 0 needs a positive control, because unlike a grep's zero it goes silent the moment the path moves. Third instance of the family. Found while making CI-7 the auditor of every guard, which is also why the auditors themselves are now counted: CI-6 and CI-7 were the only files in the repository with no budget, ratchet or waiver"

[[pit]]
