# ci/baseline.toml — the ONE waiver file every shape check shares (ADR-0042 / CI-6).
#
# A waiver is a debt with a date, not a permission:
#   1. `owner` and `due` are mandatory. An exemption nobody owns is an omission.
#   2. On `due` the waiver STOPS WORKING and the check goes red again.
#   3. Waivers are staggered on purpose. All 33 CI-4 waivers sharing one date
#      would turn the whole repo red on a single morning and the gate would be
#      switched off rather than satisfied — a deadline that cannot be met is a
#      deadline that gets removed.
#   4. The counts are NOT written here. The checker derives them; a written-down
#      number rots (P8).
#
# `src/config.rs` is deliberately absent: it is marked DATA-ONLY and the marker
# is verified (branch budget), so it needs no waiver.

