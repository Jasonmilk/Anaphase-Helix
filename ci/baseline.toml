# ─── ratchet ────────────────────────────────────────────────────────────────
# One entry per source file: the NCLOC it had when the ratchet was set. A file
# may shrink, never grow.
#
# Why a ratchet and not just a number: a threshold has to answer "how big is too
# big", which nobody can answer defensibly -- the 300 in the spec was already
# contradicted within the same round, when bind.rs reached 302 one line after
# being measured at 301. A ratchet asks a question that needs no calibration and
# cannot be argued with: is this file longer than it was? It also means the
# budget tightens on its own, because every later edit has to fit in the space an
# earlier one left.
#
# The numbers below are derived, not chosen: regenerated with
# `python3 ci/check_line_budget.py --root . --emit-ratchet`.
#
