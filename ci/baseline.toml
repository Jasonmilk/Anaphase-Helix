# ─── split window (ADR-0042) ────────────────────────────────────────────────
# A pure-move split CANNOT be zero-delta on NCLOC, and that was measured rather
# than assumed: splitting src/criteria/mod.rs (291) into three files produced 295,
# because `mod.rs` gains a `pub use` line per part that did not exist before.
# Part of that increase is permanent (the re-export surface) and the rest is the
# ordinary weight of files naming what they use.
#
# Without an allowance the directory ratchet goes red on the first day of the
# split, and it would be red because the checker is working correctly. Making the
# ratchet report-only for the duration, or waiving it, would both teach that
# refactoring means switching the gate off. So the increase is authorized here in
# advance: a number, a reason and a date.
#
# The allowance is an ESTIMATE from one measurement (about +6 per split file:
# module header plus re-exports, times seven parts for run_cycle.rs, rounded up).
# It is not a target, and the window closes with the split.
[[split_window]]
target    = "src/"
allowance = 60
reason    = "ADR-0042 pure-move split of run_cycle.rs: re-export surface and per-file headers. Measured basis: criteria/mod.rs 291 -> 295 when split into three. Estimate assumed 7 segments; the real count is 8 (usage.rs was added after emit_usage proved observable). The estimate is kept as-is so the closing record can compare it against the actual."
due       = "2026-10-09"

# ---------------------------------------------------------------- fix windows
#
# The third class. A waiver is a DEBT ("I will repay it") and carries owner+due;
# a split window is a REFACTOR allowance ("the structure changed") and carries a
# cap plus an ADR; a fix is neither, so its legitimacy comes from the pit record
# it closes. A waiver proves it will vanish; a fix window proves it had to exist.
#
# No `due` here, and the checker rejects one: a fix carrying a deadline is a debt
# wearing the wrong label. No missing `k_id` either — that is a waiver in
# disguise, and it is likewise rejected.
#
# These are kept OFF the split allowance deliberately. The split window's
# "estimated 60 against actual X" is the one number that answers "why split 2093
# lines"; folding fix lines into it would destroy that comparison permanently.
#
# A cap is bounded by the target's own baseline: at most FIX_CAP_RATIO (10%) of
# it, floored at 5 lines so a small file is not barred from citing any fix. This
# class reaches FILES, which the split window deliberately does not, so it is the
# more abusable one — any change can be called a fix. The ratio is the symmetric
# constraint; without it the only bound is the author's own number.
#
# The first version of the entry below asked for 119 and was refused by that rule
# on its first run: 119 > 10% of 1156. The cap is now 115 and the directory
# totals 1319, so the bound is real and has 12 lines of slack, not 60.
#
# Measured on 2026-09-18, before the entries were written.
[[fix_window]]
target = "src/run_cycle/"
cap    = 115
k_id   = "K-035,B22,K-033"
reason = "Period verdict module (verdict.rs, 102 NCLOC) plus the loop's own reporting, so an impasse the model declares survives to the outcome and is observable without the panel. K-033 is cited because the safety gate move put its disagreeing branches in this directory; that move's own ~44 lines ride the split allowance, not this one."

[[fix_window]]
target = "src/run_cycle/mod.rs"
cap    = 13
k_id   = "K-035,B22"
reason = "sees the impasse as it happens and reports it at the source, because the ring buffer is only read while a panel is open"

[[fix_window]]
target = "src/main.rs"
cap    = 7
k_id   = "B22,B17"
reason = "the HTTP channel carries the whole verdict instead of only `done`, so an impasse is distinguishable from a normal end; and the startup line that reports an ungoverned engine"

# B17 is a FEATURE, not a fix, and the ratio rule said so before I did: appending
# governance to a 198-line health.rs is a 60% increase, far past the tenth that a
# fix is allowed. So it lives in its own file, which seeds at birth, and this
# entry covers only what the rest of the tree had to grow to surface it.
[[fix_window]]
target = "src/health.rs"
cap    = 1
k_id   = "B17"
reason = "the health payload gains one governance key, kept separate from `ok`"

# A directory entry, so B17's new file does not eat the split allowance. The two
# numbers stay separable: 40 for this, 60 for ADR-0042, and the estimate-versus-
# actual comparison the split allowance exists to produce is still available.
[[fix_window]]
target = "src/"
cap    = 40
k_id   = "B17"
reason = "src/governance.rs (56 NCLOC) plus the payload key and startup line, measured at +40 for the directory. New files seed at birth individually but still count in the directory total, so without this they would be paid for out of the split window"

# Two module declarations. The test module is declared here rather than inside
# `governance.rs` because that file is a file, not a directory: a `mod` inside it
# resolves to `src/governance/governance_tests.rs`, which does not exist. Same
# reason `verdict_tests` is declared from its own module root.
[[fix_window]]
target = "src/lib.rs"
cap    = 3
k_id   = "B17"
reason = "declares the new governance module and its test module"

# This file was SEEDED MID-DEVELOPMENT: D6 seeds a new file at birth, and the first
# run happened while it was 56 lines, before the contract assertions added the two
# accessor functions the tests read. So its baseline is not a previous release, and
# the cap covers the rest of the same work unit. The cap is 4 because 5 is the
# ceiling (10% of 56, floored at 5) and the growth was 6 — the ratio rule forced one
# line of economy, which it got by compacting an accessor rather than by widening
# the cap. A second growth spurt here means the seed is stale and should be re-taken
# deliberately, not nudged.
[[fix_window]]
target = "src/governance.rs"
cap    = 4
k_id   = "B17"
reason = "the two precondition accessors the contract assertions read, added after the file was seeded"
