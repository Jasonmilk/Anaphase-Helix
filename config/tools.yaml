tools:
  - name: "dag_branch_create"
    description: "Create a new task branch DAG extending from self portrait"
    parameters:
      type: object
      properties:
        parent_node: { type: string }
        branch_name: { type: string }
        intent: { type: string }
      required: ["parent_node", "branch_name", "intent"]
    executor: "internal"
    timeout: 10
    permissions: ["write"]

  - name: "ana_kb_fetch"
    description: "Fetch a knowledge base node by ID"
    parameters:
      type: object
      properties:
        node_id: { type: string }
        mode: { type: string, enum: ["summary", "full"], default: "summary" }
      required: ["node_id"]
    executor: "cli"
    command: "ana kb fetch {node_id} --mode {mode}"
    timeout: 30
    permissions: ["read"]
